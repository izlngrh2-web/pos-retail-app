<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Retail App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel untuk membaca kode JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- MOCK DATABASE TAMPILAN AWAL ---
    const MOCK_BRANCHES = [
      { id: 'b1', name: 'Toko Utama' },
      { id: 'b2', name: 'Cabang Selatan' }
    ];

    const MOCK_PRODUCTS = [
      { id: 'p1', branch_id: 'b1', name: 'Kopi Arabica 1kg', purchase_price: 100000, selling_price: 150000, stock: 50 },
      { id: 'p2', branch_id: 'b1', name: 'Gula Aren 1kg', purchase_price: 20000, selling_price: 35000, stock: 30 },
      { id: 'p3', branch_id: 'b2', name: 'Kopi Robusta 1kg', purchase_price: 80000, selling_price: 120000, stock: 40 },
    ];

    const MOCK_TRANSACTIONS = [
      { 
        id: 't1', branch_id: 'b1', user_id: 'u2', type: 'SALE', 
        total_amount: 150000, admin_fee: 5000, status: 'COMPLETED',
        created_at: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString(),
        items: [{ product_id: 'p1', qty: 1, unit_price: 150000, unit_cost: 100000 }]
      }
    ];

    const MOCK_EXPENSES = [
      { id: 'e1', branch_id: 'b1', category_id: 'ec1', amount: 500000, date: new Date().toISOString(), description: 'Listrik' }
    ];

    // URL Web App Google Apps Script Anda
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrA-dYXQnCgsEYPHdDgEpVGYqvo9K_HnmzNGHr5TH6F9bTwxMpf5r4LDPJVvmUixE/exec';

    function App() {
      // State: Auth
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [authView, setAuthView] = useState('login');
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '', oldPassword: '', newPassword: '', role: 'CASHIER', branch_id: 'b1' });
      const [isLoading, setIsLoading] = useState(false);

      // State: Navigation & Global
      const [currentUser, setCurrentUser] = useState(null);
      const [currentView, setCurrentView] = useState('dashboard');
      const [toast, setToast] = useState(null);

      // State: Data
      const [products, setProducts] = useState(MOCK_PRODUCTS);
      const [transactions, setTransactions] = useState(MOCK_TRANSACTIONS);
      const [expenses, setExpenses] = useState(MOCK_EXPENSES);
      
      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(amount);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'login', email: authForm.email, password: authForm.password })
          });
          const result = await response.json();
          if (result.status === 'success') {
            setCurrentUser(result.data);
            setIsAuthenticated(true);
            showToast(`Selamat datang, ${result.data.name}!`);
          } else {
            showToast(result.message || 'Email atau password salah.', 'error');
          }
        } catch (error) {
          showToast('Terjadi kesalahan koneksi ke server.', 'error');
        } finally {
          setIsLoading(false);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          const payload = { action: 'register', ...authForm, branch_id: authForm.role === 'OWNER' ? null : authForm.branch_id };
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (result.status === 'success') {
            showToast('Pendaftaran berhasil! Silakan Login.');
            setAuthView('login');
            setAuthForm({ ...authForm, password: '' });
          } else {
            showToast(result.message || 'Gagal mendaftar.', 'error');
          }
        } catch (error) {
          showToast('Terjadi kesalahan koneksi ke server.', 'error');
        } finally {
          setIsLoading(false);
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          const payload = { action: 'change_password', email: authForm.email, oldPassword: authForm.oldPassword, newPassword: authForm.newPassword };
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (result.status === 'success') {
            showToast('Password berhasil diubah! Silakan login.');
            setAuthView('login');
          } else {
            showToast(result.message || 'Gagal mengubah password.', 'error');
          }
        } catch (error) {
          showToast('Terjadi kesalahan koneksi.', 'error');
        } finally {
          setIsLoading(false);
        }
      };

      const isOwner = currentUser?.role === 'OWNER';
      const filteredTransactions = isOwner ? transactions : transactions.filter(t => t.branch_id === currentUser?.branch_id);
      const filteredExpenses = isOwner ? expenses : expenses.filter(e => e.branch_id === currentUser?.branch_id);

      const dashboardStats = useMemo(() => {
        let total_sales = 0; let cogs = 0; let admin_fee = 0; let total_purchases = 0;
        filteredTransactions.filter(t => t.status === 'COMPLETED').forEach(t => {
          if (t.type === 'SALE') {
            total_sales += t.total_amount;
            admin_fee += (t.admin_fee || 0);
            t.items.forEach(item => { cogs += (item.qty * item.unit_cost); });
          }
        });
        const total_operational_expenses = filteredExpenses.reduce((sum, exp) => sum + exp.amount, 0);
        const net_profit = total_sales - cogs - admin_fee - total_operational_expenses;
        return { total_sales, cogs, admin_fee, total_operational_expenses, net_profit };
      }, [filteredTransactions, filteredExpenses]);

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            {toast && <div className={`fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white z-50 ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>{toast.msg}</div>}
            <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
              <h1 className="text-2xl font-bold text-blue-600 text-center mb-6">POS Retail App</h1>
              
              {authView === 'login' && (
                <form onSubmit={handleLogin} className="space-y-4">
                  <input type="email" required className="w-full px-4 py-2 border rounded-lg" value={authForm.email} onChange={(e) => setAuthForm({...authForm, email: e.target.value})} placeholder="Email" />
                  <input type="password" required className="w-full px-4 py-2 border rounded-lg" value={authForm.password} onChange={(e) => setAuthForm({...authForm, password: e.target.value})} placeholder="Password" />
                  <button type="submit" disabled={isLoading} className="w-full py-2 px-4 rounded-lg text-white font-medium bg-blue-600 hover:bg-blue-700">{isLoading ? 'Loading...' : 'Masuk'}</button>
                  <p className="text-center text-sm mt-4">Belum punya akun? <button type="button" onClick={() => setAuthView('register')} className="text-blue-600">Daftar</button></p>
                  <p className="text-center text-sm"><button type="button" onClick={() => setAuthView('change_password')} className="text-gray-500">Ganti Password?</button></p>
                </form>
              )}

              {authView === 'register' && (
                <form onSubmit={handleRegister} className="space-y-4">
                  <input type="text" required className="w-full px-4 py-2 border rounded-lg" value={authForm.name} onChange={(e) => setAuthForm({...authForm, name: e.target.value})} placeholder="Nama Lengkap" />
                  <input type="email" required className="w-full px-4 py-2 border rounded-lg" value={authForm.email} onChange={(e) => setAuthForm({...authForm, email: e.target.value})} placeholder="Email" />
                  <input type="password" required className="w-full px-4 py-2 border rounded-lg" value={authForm.password} onChange={(e) => setAuthForm({...authForm, password: e.target.value})} placeholder="Password" />
                  <select className="w-full px-4 py-2 border rounded-lg" value={authForm.role} onChange={(e) => setAuthForm({...authForm, role: e.target.value})}>
                    <option value="CASHIER">Kasir</option>
                    <option value="OWNER">Owner</option>
                  </select>
                  {authForm.role === 'CASHIER' && (
                    <select className="w-full px-4 py-2 border rounded-lg" value={authForm.branch_id} onChange={(e) => setAuthForm({...authForm, branch_id: e.target.value})}>
                      {MOCK_BRANCHES.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                    </select>
                  )}
                  <button type="submit" disabled={isLoading} className="w-full py-2 px-4 rounded-lg text-white font-medium bg-green-600">{isLoading ? 'Loading...' : 'Daftar'}</button>
                  <p className="text-center text-sm mt-4">Kembali ke <button type="button" onClick={() => setAuthView('login')} className="text-blue-600">Login</button></p>
                </form>
              )}

              {authView === 'change_password' && (
                <form onSubmit={handleChangePassword} className="space-y-4">
                  <input type="email" required className="w-full px-4 py-2 border rounded-lg" value={authForm.email} onChange={(e) => setAuthForm({...authForm, email: e.target.value})} placeholder="Email Anda" />
                  <input type="password" required className="w-full px-4 py-2 border rounded-lg" value={authForm.oldPassword} onChange={(e) => setAuthForm({...authForm, oldPassword: e.target.value})} placeholder="Password Lama" />
                  <input type="password" required className="w-full px-4 py-2 border rounded-lg" value={authForm.newPassword} onChange={(e) => setAuthForm({...authForm, newPassword: e.target.value})} placeholder="Password Baru" />
                  <button type="submit" disabled={isLoading} className="w-full py-2 px-4 rounded-lg text-white font-medium bg-orange-500">{isLoading ? 'Loading...' : 'Update Password'}</button>
                  <p className="text-center text-sm mt-4">Kembali ke <button type="button" onClick={() => setAuthView('login')} className="text-blue-600">Login</button></p>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-gray-50 text-gray-800">
          {toast && <div className={`fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white z-50 ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>{toast.msg}</div>}
          
          <div className="w-64 bg-white border-r flex flex-col p-4">
            <h1 className="text-xl font-bold text-blue-600 mb-6">POS Retail App</h1>
            <button onClick={() => setCurrentView('dashboard')} className={`p-3 text-left rounded-lg mb-2 ${currentView==='dashboard'?'bg-blue-50 text-blue-700 font-bold':'hover:bg-gray-100'}`}>📊 Dashboard</button>
            <button onClick={() => setCurrentView('transactions')} className={`p-3 text-left rounded-lg mb-2 ${currentView==='transactions'?'bg-blue-50 text-blue-700 font-bold':'hover:bg-gray-100'}`}>🛒 Transaksi</button>
            
            <div className="mt-auto pt-4 border-t">
              <p className="text-sm font-bold truncate">{currentUser?.name}</p>
              <p className="text-xs text-gray-500 mb-4">{currentUser?.role}</p>
              <button onClick={() => setIsAuthenticated(false)} className="w-full p-2 text-sm text-red-600 border border-red-200 rounded hover:bg-red-50">Logout</button>
            </div>
          </div>

          <div className="flex-1 p-8 overflow-y-auto">
            {currentView === 'dashboard' && (
              <div>
                <h2 className="text-2xl font-bold mb-6">Dashboard Laba / Rugi</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  <div className="bg-white p-6 rounded-xl border shadow-sm"><p className="text-gray-500 text-sm font-semibold">Total Penjualan</p><p className="text-2xl font-black">{formatCurrency(dashboardStats.total_sales)}</p></div>
                  <div className="bg-white p-6 rounded-xl border shadow-sm"><p className="text-gray-500 text-sm font-semibold">HPP</p><p className="text-2xl font-black text-red-600">{formatCurrency(dashboardStats.cogs)}</p></div>
                  <div className="bg-white p-6 rounded-xl border shadow-sm bg-green-600 text-white"><p className="text-green-100 text-sm font-semibold">Laba Bersih</p><p className="text-2xl font-black">{formatCurrency(dashboardStats.net_profit)}</p></div>
                </div>
              </div>
            )}
            {currentView === 'transactions' && (
              <div><h2 className="text-2xl font-bold mb-6">Modul Transaksi (Simulasi)</h2><p>Data transaksi ditampilkan di sini.</p></div>
            )}
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Retail Pro - Multi-Tenant</title>
  
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8653/8653200.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 
              800: '#1e40af', 900: '#1e3a8a', 950: '#172554',
            }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'float': '0 10px 30px -5px rgba(0, 0, 0, 0.1)',
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f8fafc; overflow-x: hidden; touch-action: manipulation; }
    button, input, select { cursor: pointer; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeSlideUp 0.3s ease-out forwards; }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-modal { animation: fadeInScale 0.2s ease-out forwards; }

    @media print {
      body * { visibility: hidden !important; }
      #printable-receipt, #printable-receipt *, #printable-pdf-report, #printable-pdf-report * { visibility: visible !important; }
      #printable-receipt, #printable-pdf-report {
        position: absolute; left: 0; top: 0; width: 100%; max-width: 100%;
        box-shadow: none !important; border: none !important; padding: 20px !important; margin: 0 !important;
        background: white !important;
      }
    }
  </style>
</head>
<body class="text-gray-800 antialiased selection:bg-brand-200 selection:text-brand-900">
  <div id="root"></div>

  <script>
    window.addEventListener('error', function(e) {
      const root = document.getElementById('root');
      if (root && root.innerHTML.trim() === '') {
        root.innerHTML = `<div style="padding: 40px; font-family: sans-serif; color: #dc2626;"><h3>Terjadi Kesalahan Saat Memuat Aplikasi</h3><p>${e.message} (Line: ${e.lineno})</p></div>`;
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker terdaftar!', reg.scope))
          .catch(err => console.log('Gagal mendaftar Service Worker:', err));
      });
    }
  </script>

  <script type="text/babel">
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrA-dYXQnCgsEYPHdDgEpVGYqvo9K_HnmzNGHr5TH6F9bTwxMpf5r4LDPJVvmUixE/exec';
    const EXCLUSIVE_TARGET_SS_ID = '1FC9vn_RcGhETXJRLWDkKk1-QkT50oAg7zQ9rY5lF_NE';

    function timeAgo(dateString) {
      const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + " thn";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + " bln";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + " hr";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + " jam";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + " mnt";
      return "Baru saja";
    }

    function App() {
      const [isAuthenticated, setIsAuthenticated] = React.useState(() => localStorage.getItem('pos_is_auth') === 'true');
      const [currentUser, setCurrentUser] = React.useState(() => {
        const saved = localStorage.getItem('pos_current_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [authView, setAuthView] = React.useState('login'); 
      const [isLoading, setIsLoading] = React.useState(false);
      
      const [branches, setBranches] = React.useState([]);
      const [users, setUsers] = React.useState([]);

      const [authForm, setAuthForm] = React.useState({ name: '', email: '', password: '', role: 'OWNER', branch_id: '', store_name: '', spreadsheet_id: '', oldPassword: '', newPassword: '' });
      const [profileForm, setProfileForm] = React.useState({ name: currentUser?.name || '', oldPassword: '', newPassword: '', avatar: currentUser?.avatar || '', spreadsheet_id: currentUser?.spreadsheet_id || '', avatarChanged: false });
      const avatarInputRef = React.useRef(null);

      const [currentView, setCurrentView] = React.useState('dashboard');
      const [toast, setToast] = React.useState(null);
      const [isExporting, setIsExporting] = React.useState(false);
      const [isRefreshing, setIsRefreshing] = React.useState(false);

      const currentDate = new Date();
      const [dashboardFilterMode, setDashboardFilterMode] = React.useState('monthly');
      const [selectedMonth, setSelectedMonth] = React.useState(currentDate.getMonth());
      const [selectedYear, setSelectedYear] = React.useState(currentDate.getFullYear());
      const [dashboardBranchFilter, setDashboardBranchFilter] = React.useState('ALL');

      const [products, setProducts] = React.useState(() => { const saved = localStorage.getItem('pos_products'); return saved ? JSON.parse(saved) : []; });
      const [transactions, setTransactions] = React.useState(() => { const saved = localStorage.getItem('pos_transactions'); return saved ? JSON.parse(saved) : []; });
      const [expenses, setExpenses] = React.useState(() => { const saved = localStorage.getItem('pos_expenses'); return saved ? JSON.parse(saved) : []; });

      const [selectedReceiptTrx, setSelectedReceiptTrx] = React.useState(null);
      const [isGeneratingImage, setIsGeneratingImage] = React.useState(false);
      const receiptRef = React.useRef(null);

      const [editingProduct, setEditingProduct] = React.useState(null);
      const [appDialog, setAppDialog] = React.useState({ isOpen: false, type: 'confirm', title: '', message: '', promptValue: '', onConfirm: null });

      const [newStoreModal, setNewStoreModal] = React.useState({ isOpen: false, url: '' });

      const getAvailableStock = (product, allProducts) => {
        if (product.master_id) {
          const master = allProducts.find(p => p.id === product.master_id);
          if (master) return Math.floor(master.stock * (product.yield_per_master || 1));
          return 0; 
        }
        return Math.round(product.stock * 100) / 100;
      };

      const getPayloadWithAuth = (basePayload) => {
        return {
          ...basePayload,
          currentUserEmail: currentUser?.email || '',
          spreadsheetId: currentUser?.spreadsheet_id || ''
        };
      };

      React.useEffect(() => {
        if (currentUser?.spreadsheet_id) {
          fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_branches' })) })
            .then(res => res.json())
            .then(res => { if(res.status === 'success') setBranches(res.data); });
        }
      }, [currentUser]);

      const loadDataFromServer = async () => {
        if (!currentUser?.spreadsheet_id) return;
        try {
          const resProd = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_products' })) });
          const resultProd = await resProd.json();
          if (resultProd.status === 'success') setProducts(resultProd.data);

          const resTrx = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_transactions' })) });
          const resultTrx = await resTrx.json();
          if (resultTrx.status === 'success') setTransactions(resultTrx.data);

          const resExp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_expenses' })) });
          const resultExp = await resExp.json();
          if (resultExp.status === 'success') setExpenses(resultExp.data);

          if (currentUser?.role === 'OWNER') {
            const resUsers = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_users' })) });
            const resultUsers = await resUsers.json();
            if (resultUsers.status === 'success') setUsers(resultUsers.data);

            const resBranch = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_branches' })) });
            const resultBranch = await resBranch.json();
            if (resultBranch.status === 'success') setBranches(resultBranch.data);
          }
        } catch (error) {
          console.error("Gagal memuat data", error);
        }
      };

      React.useEffect(() => { if (isAuthenticated && currentUser?.spreadsheet_id) loadDataFromServer(); }, [isAuthenticated, currentUser?.spreadsheet_id]);

      React.useEffect(() => { localStorage.setItem('pos_products', JSON.stringify(products)); }, [products]);
      React.useEffect(() => { localStorage.setItem('pos_transactions', JSON.stringify(transactions)); }, [transactions]);
      React.useEffect(() => { localStorage.setItem('pos_expenses', JSON.stringify(expenses)); }, [expenses]);
      React.useEffect(() => {
        localStorage.setItem('pos_is_auth', isAuthenticated);
        if (currentUser) localStorage.setItem('pos_current_user', JSON.stringify(currentUser));
        else localStorage.removeItem('pos_current_user');
      }, [isAuthenticated, currentUser]);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount || 0);
      };

      const handleRefreshCatalog = async () => {
        setIsRefreshing(true);
        showToast('Menyinkronkan data dengan Google Sheets...', 'info');
        await loadDataFromServer();
        setIsRefreshing(false);
        showToast('Data berhasil diperbarui!');
      };

      const handleImportExternalCatalog = async () => {
        setIsRefreshing(true);
        showToast('Mengimpor katalog dari Spreadsheet eksternal...', 'info');
        try {
          const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'import_external_catalog' })) });
          const json = await res.json();
          if (json.status === 'success') {
            showToast(json.message);
            await loadDataFromServer();
          } else {
            showToast(json.message || 'Gagal mengimpor.', 'error');
          }
        } catch(e) {
          showToast('Koneksi server gagal.', 'error');
        }
        setIsRefreshing(false);
      };

      const handleImportExternalTransactions = async () => {
        setIsRefreshing(true);
        showToast('Mengimpor histori transaksi dari Sheet1...', 'info');
        try {
          const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'import_external_transactions' })) });
          const json = await res.json();
          if (json.status === 'success') {
            showToast(json.message);
            await loadDataFromServer();
          } else {
            showToast(json.message || 'Gagal mengimpor transaksi.', 'error');
          }
        } catch(e) {
          showToast('Koneksi server gagal.', 'error');
        }
        setIsRefreshing(false);
      };

      const handleAuthSubmit = async (e, actionType) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          let payload = { action: actionType };
          if (actionType === 'login') {
            payload = { ...payload, email: authForm.email, password: authForm.password };
          } else if (actionType === 'register') {
            payload = { 
              ...payload, 
              name: authForm.name, 
              email: authForm.email, 
              password: authForm.password, 
              role: authForm.role, 
              branch_id: authForm.role === 'OWNER' ? '' : authForm.branch_id,
              store_name: authForm.store_name,
              spreadsheet_id: authForm.spreadsheet_id || '' 
            };
          } else if (actionType === 'change_password') {
            payload = { ...payload, email: authForm.email, oldPassword: authForm.oldPassword, newPassword: authForm.newPassword };
          }

          const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
          const result = await response.json();

          if (result.status === 'success') {
            if (actionType === 'login') {
              setCurrentUser(result.data);
              setProfileForm({ 
                ...profileForm, 
                name: result.data.name, 
                avatar: result.data.avatar || '', 
                spreadsheet_id: result.data.spreadsheet_id || '' 
              });
              setIsAuthenticated(true);
              setCurrentView('dashboard');
              showToast(`Selamat datang, ${result.data.name}!`);
            } else if (actionType === 'register') {
              showToast('Pendaftaran berhasil! Silakan masuk.');
              if (result.spreadsheet_url) {
                setNewStoreModal({ isOpen: true, url: result.spreadsheet_url });
              }
              setAuthView('login');
              setAuthForm(prev => ({ ...prev, password: '' }));
            } else if (actionType === 'change_password') {
              showToast('Password berhasil diperbarui! Silakan masuk.');
              setAuthView('login');
              setAuthForm(prev => ({ ...prev, password: '', oldPassword: '', newPassword: '' }));
            }
          } else {
            showToast(result.message || 'Terjadi kesalahan.', 'error');
          }
        } catch (error) { showToast('Koneksi server gagal.', 'error'); } finally { setIsLoading(false); }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setCurrentUser(null);
        localStorage.removeItem('pos_is_auth');
        localStorage.removeItem('pos_current_user');
        showToast('Berhasil keluar.');
      };

      const handleAvatarChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 200; const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            setProfileForm({ ...profileForm, avatar: canvas.toDataURL('image/jpeg', 0.7), avatarChanged: true });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const submitProfileUpdate = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          const payload = { 
            action: 'update_profile', 
            email: currentUser.email, 
            name: profileForm.name, 
            spreadsheet_id: profileForm.spreadsheet_id,
            avatar: profileForm.avatarChanged ? profileForm.avatar : null, 
            oldPassword: profileForm.oldPassword, 
            newPassword: profileForm.newPassword 
          };
          const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
          const result = await response.json();
          if (result.status === 'success') {
            setCurrentUser(result.data);
            setProfileForm(prev => ({ ...prev, oldPassword: '', newPassword: '', avatarChanged: false }));
            showToast('Profil dan Spreadsheet ID berhasil diperbarui!');
          } else { showToast(result.message, 'error'); }
        } catch (error) { showToast('Koneksi server gagal.', 'error'); } finally { setIsLoading(false); }
      };

      const isOwner = currentUser?.role === 'OWNER';
      const activeBranchId = isOwner ? (dashboardBranchFilter === 'ALL' ? null : dashboardBranchFilter) : currentUser?.branch_id;
      const dataViewBranchId = isOwner ? null : currentUser?.branch_id;
      
      const filteredProducts = isOwner ? products : products.filter(p => p.branch_id === dataViewBranchId);
      const viewTransactions = isOwner ? transactions : transactions.filter(t => t.branch_id === dataViewBranchId);
      const viewExpenses = isOwner ? expenses : expenses.filter(e => e.branch_id === dataViewBranchId);

      const filteredTransactionsForDash = React.useMemo(() => {
        return transactions.filter(t => {
          if (activeBranchId && t.branch_id !== activeBranchId) return false;
          const d = new Date(t.created_at);
          const matchYear = d.getFullYear() === Number(selectedYear);
          if (dashboardFilterMode === 'yearly') return matchYear;
          return matchYear && d.getMonth() === Number(selectedMonth);
        });
      }, [transactions, activeBranchId, dashboardFilterMode, selectedMonth, selectedYear]);

      const filteredExpensesForDash = React.useMemo(() => {
        return expenses.filter(e => {
          if (activeBranchId && e.branch_id !== activeBranchId) return false;
          const d = new Date(e.date);
          const matchYear = d.getFullYear() === Number(selectedYear);
          if (dashboardFilterMode === 'yearly') return matchYear;
          return matchYear && d.getMonth() === Number(selectedMonth);
        });
      }, [expenses, activeBranchId, dashboardFilterMode, selectedMonth, selectedYear]);

      // TREND DATA CALCULATION (PREVIOUS PERIOD)
      const prevPeriodData = React.useMemo(() => {
        let p_sales = 0, p_cogs = 0, p_admin = 0, p_exp = 0, p_order_count = 0, p_purchase = 0;
        const isYearly = dashboardFilterMode === 'yearly';
        const targetPrevYear = isYearly ? selectedYear - 1 : (selectedMonth === 0 ? selectedYear - 1 : selectedYear);
        const targetPrevMonth = isYearly ? null : (selectedMonth === 0 ? 11 : selectedMonth - 1);

        transactions.forEach(t => {
            if (activeBranchId && t.branch_id !== activeBranchId) return;
            if (t.status !== 'COMPLETED') return;
            const d = new Date(t.created_at);
            const mYear = d.getFullYear() === targetPrevYear;
            const mMonth = isYearly || d.getMonth() === targetPrevMonth;

            if (mYear && mMonth) {
                if (t.type === 'SALE') {
                    p_sales += t.total_amount;
                    p_admin += (Number(t.admin_fee) || 0);
                    p_order_count++;
                    t.items.forEach(item => p_cogs += (item.qty * item.unit_cost));
                } else if (t.type === 'PURCHASE') {
                    p_purchase += t.total_amount;
                }
            }
        });

        expenses.forEach(e => {
            if (activeBranchId && e.branch_id !== activeBranchId) return;
            const d = new Date(e.date);
            const mYear = d.getFullYear() === targetPrevYear;
            const mMonth = isYearly || d.getMonth() === targetPrevMonth;
            if (mYear && mMonth) p_exp += Number(e.amount);
        });

        const p_profit = p_sales - p_cogs - p_admin - p_exp;
        const p_avg_order = p_order_count > 0 ? (p_sales / p_order_count) : 0;
        
        return { p_sales, p_profit, p_order_count, p_purchase, p_avg_order };
      }, [transactions, expenses, activeBranchId, dashboardFilterMode, selectedMonth, selectedYear]);

      // CURRENT STATS EXTENDED (Totals, Counts, Tops, Recents)
      const dashStatsExt = React.useMemo(() => {
        let total_sales = 0, cogs = 0, admin_fee = 0, total_purchases = 0, order_count = 0;
        const topSalesMap = {};
        const topPurchasesMap = {};

        filteredTransactionsForDash.filter(t => t.status === 'COMPLETED').forEach(t => {
            if (t.type === 'SALE') {
                total_sales += t.total_amount;
                admin_fee += (Number(t.admin_fee) || 0);
                order_count++;
                t.items.forEach(item => { 
                    cogs += (item.qty * item.unit_cost);
                    if(!topSalesMap[item.product_name]) topSalesMap[item.product_name] = { name: item.product_name, qty: 0, total: 0 };
                    topSalesMap[item.product_name].qty += item.qty;
                    topSalesMap[item.product_name].total += (item.qty * item.unit_price);
                });
            } else if (t.type === 'PURCHASE') {
                total_purchases += t.total_amount;
                t.items.forEach(item => { 
                    if(!topPurchasesMap[item.product_name]) topPurchasesMap[item.product_name] = { name: item.product_name, qty: 0, total: 0 };
                    topPurchasesMap[item.product_name].qty += item.qty;
                    topPurchasesMap[item.product_name].total += (item.qty * item.unit_price);
                });
            }
        });
        
        const total_operational_expenses = filteredExpensesForDash.reduce((sum, exp) => sum + Number(exp.amount), 0);
        const net_profit = total_sales - cogs - admin_fee - total_operational_expenses;
        const avg_order = order_count > 0 ? (total_sales / order_count) : 0;

        const topProducts = Object.values(topSalesMap).sort((a,b) => b.total - a.total).slice(0, 5);
        const topPurchasesList = Object.values(topPurchasesMap).sort((a,b) => b.total - a.total).slice(0, 5);
        
        const maxProdSales = topProducts.length > 0 ? topProducts[0].total : 1;
        const maxProdPurchases = topPurchasesList.length > 0 ? topPurchasesList[0].total : 1;

        const recentTrx = [...filteredTransactionsForDash].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);

        return { total_sales, cogs, admin_fee, total_operational_expenses, total_purchases, net_profit, order_count, avg_order, topProducts, topPurchasesList, maxProdSales, maxProdPurchases, recentTrx };
      }, [filteredTransactionsForDash, filteredExpensesForDash]);

      // UI Trend Helper
      const renderTrend = (current, prev) => {
        if (prev === 0 && current === 0) return <span className="text-gray-400 font-medium ml-2">-</span>;
        const pct = prev === 0 ? 100 : ((current - prev) / prev) * 100;
        const isPos = pct >= 0;
        return (
            <span className={`text-[11px] font-bold flex items-center ml-2 px-1.5 py-0.5 rounded ${isPos ? 'bg-green-100/50 text-green-600' : 'bg-red-100/50 text-red-600'}`}>
                <i className={`ph-bold ${isPos ? 'ph-trend-up' : 'ph-trend-down'} mr-0.5`}></i>
                {Math.abs(pct).toFixed(1)}%
            </span>
        );
      }

      const dailyChartData = React.useMemo(() => {
        const daysMap = {};
        let maxDays = 31;
        if (dashboardFilterMode === 'monthly') {
          maxDays = new Date(selectedYear, Number(selectedMonth) + 1, 0).getDate();
          for (let d = 1; d <= maxDays; d++) daysMap[d] = { day: d, revenue: 0, expense: 0, production: 0, profit: 0 };
        } else {
          for (let m = 0; m < 12; m++) daysMap[m + 1] = { day: ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"][m], revenue: 0, expense: 0, production: 0, profit: 0 };
        }

        filteredTransactionsForDash.filter(t => t.status === 'COMPLETED').forEach(t => {
          const d = new Date(t.created_at);
          const key = dashboardFilterMode === 'monthly' ? d.getDate() : d.getMonth() + 1;
          if (daysMap[key]) {
            if (t.type === 'SALE') {
              let itemCogs = 0; t.items.forEach(i => { itemCogs += (i.qty * i.unit_cost); });
              const fee = Number(t.admin_fee) || 0;
              daysMap[key].revenue += t.total_amount;
              daysMap[key].production += itemCogs;
              daysMap[key].profit += (t.total_amount - itemCogs - fee);
            }
          }
        });

        filteredExpensesForDash.forEach(e => {
          const d = new Date(e.date);
          const key = dashboardFilterMode === 'monthly' ? d.getDate() : d.getMonth() + 1;
          if (daysMap[key]) {

                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Jumlah Qty</label><input type="number" min="1" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newTrx.qty} onChange={(e)=>setNewTrx({...newTrx, qty: e.target.value})} /></div>
                  {newTrx.type === 'SALE' && ( <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Biaya Admin / Potongan (Rp)</label><input type="number" min="0" placeholder="Cth: Potongan admin" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newTrx.admin_fee} onChange={(e)=>setNewTrx({...newTrx, admin_fee: e.target.value})} /></div> )}
                  <button type="submit" className="w-full mt-4 py-3.5 bg-brand-600 text-white rounded-xl font-bold shadow-md hover:bg-brand-700 transition cursor-pointer">Simpan Transaksi</button>
                </form>
              </div>
            </div>
          )}

          {editingTrx && (
            <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white p-6 rounded-3xl w-full max-w-md shadow-float animate-modal border border-gray-100 relative">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-900">Edit Transaksi ({editingTrx.id})</h3>
                  <button onClick={() => setEditingTrx(null)} className="w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-500 rounded-full hover:bg-gray-200 cursor-pointer"><i className="ph-bold ph-x"></i></button>
                </div>
                <form onSubmit={submitEditTransaction} className="space-y-4">
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Tipe</label><select className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none bg-white font-semibold cursor-pointer" value={editingTrx.type} onChange={(e)=>setEditingTrx({...editingTrx, type: e.target.value})}><option value="SALE">Penjualan (Pemasukan)</option><option value="PURCHASE">Pembelian Stok (Pengeluaran)</option></select></div>
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Produk</label><select required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none bg-white font-medium cursor-pointer" value={editingTrx.product_id} onChange={(e)=>setEditingTrx({...editingTrx, product_id: e.target.value})}><option value="">Pilih Produk...</option>{filteredProducts.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Jumlah Qty</label><input type="number" min="1" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={editingTrx.qty} onChange={(e)=>setEditingTrx({...editingTrx, qty: e.target.value})} /></div>
                  {editingTrx.type === 'SALE' && ( <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Biaya Admin / Potongan (Rp)</label><input type="number" min="0" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={editingTrx.admin_fee} onChange={(e)=>setEditingTrx({...editingTrx, admin_fee: e.target.value})} /></div> )}
                  <button type="submit" className="w-full mt-4 py-3.5 bg-brand-600 text-white rounded-xl font-bold shadow-md hover:bg-brand-700 transition cursor-pointer">Simpan Perubahan</button>
                </form>
              </div>
            </div>
          )}

          {showAddProduct && (
            <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white p-6 rounded-3xl w-full max-w-md shadow-float animate-modal border border-gray-100 overflow-y-auto max-h-[90vh] relative">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-900">Produk Baru</h3>
                  <button onClick={() => setShowAddProduct(false)} className="w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-500 rounded-full hover:bg-gray-200 cursor-pointer"><i className="ph-bold ph-x"></i></button>
                </div>
                <form onSubmit={submitProduct} className="space-y-4">
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Nama Produk</label><input type="text" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newProduct.name} onChange={(e)=>setNewProduct({...newProduct, name: e.target.value})} /></div>
                  <div className="flex items-center space-x-2 bg-brand-50 p-3 rounded-xl border border-brand-100"><input type="checkbox" id="isVariant" checked={newProduct.is_variant} onChange={(e) => setNewProduct({...newProduct, is_variant: e.target.checked, stock: ''})} className="w-4 h-4 text-brand-600 rounded focus:ring-brand-500 cursor-pointer" /><label htmlFor="isVariant" className="text-sm font-bold text-brand-800 cursor-pointer select-none">Jadikan Varian (Gunakan Stok Master)</label></div>
                  {newProduct.is_variant ? (
                    <div className="space-y-4 p-4 border border-brand-200 rounded-xl bg-white relative">
                      <div className="absolute top-0 left-0 w-1 h-full bg-brand-500 rounded-l-xl"></div>
                      <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Pilih Master Produk</label><select required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none cursor-pointer" value={newProduct.master_id} onChange={(e)=>setNewProduct({...newProduct, master_id: e.target.value})}><option value="">-- Pilih Induk --</option>{filteredProducts.filter(p => !p.master_id).map(p => <option key={p.id} value={p.id}>{p.name} (Stok: {p.stock})</option>)}</select></div>
                      <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">1 Master Menghasilkan (Pcs)</label><input type="number" required placeholder="Cth: 10" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newProduct.yield_per_master} onChange={(e)=>setNewProduct({...newProduct, yield_per_master: e.target.value})} /></div>
                    </div>
                  ) : (
                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Stok Awal</label><input type="number" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newProduct.stock} onChange={(e)=>setNewProduct({...newProduct, stock: e.target.value})} /></div>
                  )}
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Modal (Rp)</label><input type="number" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newProduct.purchase_price} onChange={(e)=>setNewProduct({...newProduct, purchase_price: e.target.value})} /></div>
                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Harga Jual (Rp)</label><input type="number" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newProduct.selling_price} onChange={(e)=>setNewProduct({...newProduct, selling_price: e.target.value})} /></div>
                  </div>
                  <button type="submit" className="w-full mt-4 py-3.5 bg-brand-600 text-white rounded-xl font-bold shadow-md hover:bg-brand-700 transition cursor-pointer">Simpan ke Katalog</button>
                </form>
              </div>
            </div>
          )}

          {editingProduct && (
            <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white p-6 rounded-3xl w-full max-w-md shadow-float animate-modal border border-gray-100 overflow-y-auto max-h-[90vh] relative">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-900">Edit Produk / Varian</h3>
                  <button onClick={() => setEditingProduct(null)} className="w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-500 rounded-full hover:bg-gray-200 cursor-pointer"><i className="ph-bold ph-x"></i></button>
                </div>
                <form onSubmit={submitEditProduct} className="space-y-4">
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Nama Produk / Varian</label><input type="text" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={editingProduct.name} onChange={(e)=>setEditingProduct({...editingProduct, name: e.target.value})} /></div>
                  
                  <div className="flex items-center space-x-2 bg-brand-50 p-3 rounded-xl border border-brand-100">
                    <input type="checkbox" id="editIsVariant" checked={editingProduct.is_variant} onChange={(e) => setEditingProduct({...editingProduct, is_variant: e.target.checked})} className="w-4 h-4 text-brand-600 rounded focus:ring-brand-500 cursor-pointer" />
                    <label htmlFor="editIsVariant" className="text-sm font-bold text-brand-800 cursor-pointer select-none">Jadikan Varian (Gunakan Stok Master)</label>
                  </div>

                  {editingProduct.is_variant ? (
                    <div className="space-y-4 p-4 border border-brand-200 rounded-xl bg-white relative">
                      <div className="absolute top-0 left-0 w-1 h-full bg-brand-500 rounded-l-xl"></div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Pilih Master Produk</label>
                        <select required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none cursor-pointer" value={editingProduct.master_id} onChange={(e)=>setEditingProduct({...editingProduct, master_id: e.target.value})}>
                          <option value="">-- Pilih Induk --</option>
                          {filteredProducts.filter(p => !p.master_id && p.id !== editingProduct.id).map(p => <option key={p.id} value={p.id}>{p.name} (Stok: {p.stock})</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">1 Master Menghasilkan (Pcs)</label>
                        <input type="number" required placeholder="Cth: 10" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={editingProduct.yield_per_master} onChange={(e)=>setEditingProduct({...editingProduct, yield_per_master: e.target.value})} />
                      </div>
                    </div>
                  ) : (
                    <div>
                      <label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Jumlah Stok Master</label>
                      <input type="number" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={editingProduct.stock} onChange={(e)=>setEditingProduct({...editingProduct, stock: e.target.value})} />
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Modal (Rp)</label><input type="number" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={editingProduct.purchase_price} onChange={(e)=>setEditingProduct({...editingProduct, purchase_price: e.target.value})} /></div>
                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Harga Jual (Rp)</label><input type="number" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={editing_price => setEditingProduct({...editingProduct, selling_price: e.target.value})} /></div>
                  </div>
                  <button type="submit" className="w-full mt-4 py-3.5 bg-brand-600 text-white rounded-xl font-bold shadow-md hover:bg-brand-700 transition cursor-pointer">Simpan Perubahan</button>
                </form>
              </div>
            </div>
          )}

          {showAddBranch && (
            <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white p-6 rounded-3xl w-full max-w-md shadow-float animate-modal border border-gray-100 relative">
                <div className="flex justify-between items-center">
                  <h3 className="text-xl font-bold text-gray-900">Tambah Cabang Baru</h3>
                  <button onClick={() => setShowAddBranch(false)} className="w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-500 rounded-full hover:bg-gray-200 cursor-pointer"><i className="ph-bold ph-x"></i></button>
                </div>
                <form onSubmit={submitBranch} className="space-y-4 mt-6">
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Nama Cabang</label><input type="text" required placeholder="Cth: Cabang Selatan" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newBranch.name} onChange={(e)=>setNewBranch({...newBranch, name: e.target.value})} /></div>
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Lokasi / Alamat</label><input type="text" required className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newBranch.location} onChange={(e)=>setNewBranch({...newBranch, location: e.target.value})} /></div>
                  <button type="submit" className="w-full mt-4 py-3.5 bg-brand-600 text-white rounded-xl font-bold shadow-md hover:bg-brand-700 transition cursor-pointer">Simpan Cabang</button>
                </form>
              </div>
            </div>
          )}

          {showAddUser && (
            <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white p-6 rounded-3xl w-full max-w-md shadow-float animate-modal border border-gray-100 relative">
                <div className="flex justify-between items-center">
                  <h3 className="text-xl font-bold text-gray-900">Tambah Karyawan Baru</h3>
                  <button onClick={() => setShowAddUser(false)} className="w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-500 rounded-full hover:bg-gray-200 cursor-pointer"><i className="ph-bold ph-x"></i></button>
                </div>
                <form onSubmit={submitUser} className="space-y-4 mt-6">
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Nama Lengkap</label><input type="text" required className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newUserForm.name} onChange={(e)=>setNewUserForm({...newUserForm, name: e.target.value})} /></div>
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Email</label><input type="email" required className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newUserForm.email} onChange={(e)=>setNewUserForm({...newUserForm, email: e.target.value})} /></div>
                  <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Kata Sandi</label><input type="text" required placeholder="Min 6 Karakter" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none" value={newUserForm.password} onChange={(e)=>setNewUserForm({...newUserForm, password: e.target.value})} /></div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Peran</label><select className="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white focus:ring-2 focus:ring-brand-500 outline-none cursor-pointer" value={newUserForm.role} onChange={(e)=>setNewUserForm({...newUserForm, role: e.target.value})}><option value="CASHIER">Kasir</option><option value="OWNER">Owner / Admin</option></select></div>
                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Penempatan Cabang</label><select required={newUserForm.role !== 'OWNER'} disabled={newUserForm.role === 'OWNER'} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white focus:ring-2 focus:ring-brand-500 outline-none disabled:bg-gray-100 disabled:cursor-not-allowed cursor-pointer" value={newUserForm.branch_id} onChange={(e)=>setNewUserForm({...newUserForm, branch_id: e.target.value})}><option value="">- Pilih Cabang -</option>{branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}</select></div>
                  </div>
                  <button type="submit" disabled={isLoading} className="w-full mt-2 py-3 bg-brand-600 text-white rounded-xl font-bold shadow-md hover:bg-brand-700 transition disabled:opacity-50 cursor-pointer">{isLoading ? 'Menyimpan...' : 'Simpan Karyawan'}</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

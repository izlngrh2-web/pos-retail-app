<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Pro Finance - Modern Financial & POS</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8653/8653200.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          boxShadow: {
            'modern': '0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 0 1px 1px rgba(15, 23, 42, 0.04)',
            'card': '0 4px 20px -2px rgba(15, 23, 42, 0.03)',
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html { height: -webkit-fill-available; }
    body { 
      overflow-x: hidden; 
      touch-action: manipulation; 
      height: 100%;
      height: -webkit-fill-available;
      overscroll-behavior: none;
    }
    button, input, select { cursor: pointer; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .animate-modal { animation: fadeInScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .modal-scroll { max-height: 65vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrA-dYXQnCgsEYPHdDgEpVGYqvo9K_HnmzNGHr5TH6F9bTwxMpf5r4LDPJVvmUixE/exec';

    function timeAgo(dateString) {
      const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + " thn";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + " bln";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + " hr";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + " jam";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + " mnt";
      return "Baru saja";
    }

    function App() {
      const [isAuthenticated, setIsAuthenticated] = React.useState(() => localStorage.getItem('pos_is_auth') === 'true');
      const [currentUser, setCurrentUser] = React.useState(() => {
        const saved = localStorage.getItem('pos_current_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [themeMode, setThemeMode] = React.useState(() => localStorage.getItem('pos_theme_mode') || 'dark');
      const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);
      
      const [branches, setBranches] = React.useState([]);
      const [users, setUsers] = React.useState([]);
      const [notifications, setNotifications] = React.useState(() => {
        const saved = localStorage.getItem('pos_notifications');
        return saved ? JSON.parse(saved) : [
          { id: 'n1', title: 'Sistem Aktif', message: 'Selamat datang di Pro Finance Enterprise.', created_at: new Date().toISOString(), is_read: false, type: 'INFO' }
        ];
      });

      const [authForm, setAuthForm] = React.useState({ email: '', password: '' });
      const [profileForm, setProfileForm] = React.useState({ name: currentUser?.name || '', oldPassword: '', newPassword: '' });

      const [currentView, setCurrentView] = React.useState('dashboard');
      const [toast, setToast] = React.useState(null);

      const currentDate = new Date();
      const [dashboardFilterMode, setDashboardFilterMode] = React.useState('monthly');
      const [selectedMonth, setSelectedMonth] = React.useState(currentDate.getMonth());
      const [selectedYear, setSelectedYear] = React.useState(currentDate.getFullYear());
      const [dashboardBranchFilter, setDashboardBranchFilter] = React.useState('ALL');

      const [products, setProducts] = React.useState(() => { const saved = localStorage.getItem('pos_products'); return saved ? JSON.parse(saved) : []; });
      const [transactions, setTransactions] = React.useState(() => { const saved = localStorage.getItem('pos_transactions'); return saved ? JSON.parse(saved) : []; });
      const [expenses, setExpenses] = React.useState(() => { const saved = localStorage.getItem('pos_expenses'); return saved ? JSON.parse(saved) : []; });

      const [selectedReceiptTrx, setSelectedReceiptTrx] = React.useState(null);
      const [selectedDetailTrx, setSelectedDetailTrx] = React.useState(null);
      const [selectedNotifDetail, setSelectedNotifDetail] = React.useState(null); // Modal detail notifikasi pembatalan

      const [appDialog, setAppDialog] = React.useState({ isOpen: false, type: 'confirm', title: '', message: '', promptValue: '', onConfirm: null });
      
      const [showAddProduct, setShowAddProduct] = React.useState(false);
      const [newProduct, setNewProduct] = React.useState({ name: '', purchase_price: '', selling_price: '', stock: '' });
      const [showAddTransaction, setShowAddTransaction] = React.useState(false);
      const [newTrx, setNewTrx] = React.useState({ type: 'SALE', product_id: '', qty: 1, admin_fee: 0 });
      const [showAddExpense, setShowAddExpense] = React.useState(false);
      const [newExp, setNewExp] = React.useState({ description: '', amount: '' });
      
      const [showAddUser, setShowAddUser] = React.useState(false);
      const [editingUser, setEditingUser] = React.useState(null);
      const [newUserForm, setNewUserForm] = React.useState({ name: '', email: '', password: '', role: 'CASHIER', branch_id: 'b1' });

      const getAvailableStock = (product, allProducts) => {
        return Math.round(product.stock * 100) / 100;
      };

      React.useEffect(() => {
        const rootHtml = document.documentElement;
        if (themeMode === 'dark') rootHtml.classList.add('dark');
        else rootHtml.classList.remove('dark');
        localStorage.setItem('pos_theme_mode', themeMode);
      }, [themeMode]);

      React.useEffect(() => {
        localStorage.setItem('pos_notifications', JSON.stringify(notifications));
      }, [notifications]);

      const getPayloadWithAuth = (basePayload) => ({
        ...basePayload,
        currentUserEmail: currentUser?.email || '',
        spreadsheetId: currentUser?.spreadsheet_id || ''
      });

      const loadDataFromServer = async () => {
        if (!currentUser?.spreadsheet_id) return;
        try {
          const resProd = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_products' })) });
          const resultProd = await resProd.json();
          if (resultProd.status === 'success') setProducts(resultProd.data);

          const resTrx = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_transactions' })) });
          const resultTrx = await resTrx.json();
          if (resultTrx.status === 'success') setTransactions(resultTrx.data);

          const resExp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_expenses' })) });
          const resultExp = await resExp.json();
          if (resultExp.status === 'success') setExpenses(resultExp.data);

          if (currentUser?.role === 'OWNER') {
            const resUsers = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_users' })) });
            const resultUsers = await resUsers.json();
            if (resultUsers.status === 'success') setUsers(resultUsers.data);

            const resBranch = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_branches' })) });
            const resultBranch = await resBranch.json();
            if (resultBranch.status === 'success') setBranches(resultBranch.data);
          }
        } catch (error) { console.error("Gagal memuat data", error); }
      };

      React.useEffect(() => {
        if (isAuthenticated && currentUser?.spreadsheet_id) loadDataFromServer();
      }, [isAuthenticated, currentUser?.spreadsheet_id]);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount || 0);
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        try {
          const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', email: authForm.email, password: authForm.password }) });
          const result = await response.json();
          if (result.status === 'success') {
            setCurrentUser(result.data);
            setProfileForm({ name: result.data.name, oldPassword: '', newPassword: '' });
            setIsAuthenticated(true);
            setCurrentView('dashboard');
            showToast(`Selamat datang, ${result.data.name}!`);
          } else { showToast(result.message || 'Gagal masuk.', 'error'); }
        } catch (error) { showToast('Koneksi server gagal.', 'error'); }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setCurrentUser(null);
        localStorage.removeItem('pos_is_auth');
        localStorage.removeItem('pos_current_user');
        showToast('Berhasil keluar.');
      };

      const submitProfileUpdate = async (e) => {
        e.preventDefault();
        try {
          const payload = { 
            action: 'update_profile', 
            email: currentUser.email, 
            name: profileForm.name, 
            spreadsheet_id: currentUser.spreadsheet_id,
            oldPassword: profileForm.oldPassword, 
            newPassword: profileForm.newPassword 
          };
          const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
          const result = await response.json();
          if (result.status === 'success') {
            setCurrentUser(result.data);
            setProfileForm(prev => ({ ...prev, oldPassword: '', newPassword: '' }));
            showToast('Profil & Kata Sandi berhasil diperbarui!');
          } else { showToast(result.message, 'error'); }
        } catch (error) { showToast('Koneksi server gagal.', 'error'); }
      };

      const isOwner = currentUser?.role === 'OWNER';
      const activeBranchId = isOwner ? (dashboardBranchFilter === 'ALL' ? null : dashboardBranchFilter) : currentUser?.branch_id;
      const dataViewBranchId = isOwner ? null : currentUser?.branch_id;
      
      const filteredProducts = isOwner ? products : products.filter(p => p.branch_id === dataViewBranchId || p.branch_id === 'ALL' || !p.branch_id);
      const viewTransactions = (isOwner ? transactions : transactions.filter(t => t.branch_id === dataViewBranchId)).filter(t => t.status === 'COMPLETED');
      const viewExpenses = isOwner ? expenses : expenses.filter(e => e.branch_id === dataViewBranchId);

      const filteredTransactionsForDash = React.useMemo(() => {
        return transactions.filter(t => {
          if (t.status !== 'COMPLETED') return false;
          if (activeBranchId && t.branch_id !== activeBranchId) return false;
          const d = new Date(t.created_at);
          const matchYear = d.getFullYear() === Number(selectedYear);
          if (dashboardFilterMode === 'yearly') return matchYear;
          return matchYear && d.getMonth() === Number(selectedMonth);
        });
      }, [transactions, activeBranchId, dashboardFilterMode, selectedMonth, selectedYear]);

      const filteredExpensesForDash = React.useMemo(() => {
        return expenses.filter(e => {
          if (activeBranchId && e.branch_id !== activeBranchId) return false;
          const d = new Date(e.date);
          const matchYear = d.getFullYear() === Number(selectedYear);
          if (dashboardFilterMode === 'yearly') return matchYear;
          return matchYear && d.getMonth() === Number(selectedMonth);
        });
      }, [expenses, activeBranchId, dashboardFilterMode, selectedMonth, selectedYear]);

      const dashStatsExt = React.useMemo(() => {
        let total_sales = 0, cogs = 0, admin_fee = 0, order_count = 0;
        const topSalesMap = {};

        filteredTransactionsForDash.forEach(t => {
            if (t.type === 'SALE') {
                total_sales += t.total_amount;
                admin_fee += (Number(t.admin_fee) || 0);
                order_count++;
                t.items.forEach(item => { 
                    cogs += (item.qty * item.unit_cost);
                    if(!topSalesMap[item.product_name]) topSalesMap[item.product_name] = { name: item.product_name, qty: 0, total: 0 };
                    topSalesMap[item.product_name].qty += item.qty;
                    topSalesMap[item.product_name].total += (item.qty * item.unit_price);
                });
            }
        });
        
        const total_operational_expenses = filteredExpensesForDash.reduce((sum, exp) => sum + Number(exp.amount), 0);
        const net_profit = total_sales - cogs - admin_fee - total_operational_expenses;
        const topProducts = Object.values(topSalesMap).sort((a,b) => b.total - a.total).slice(0, 5);

        return { total_sales, cogs, admin_fee, total_operational_expenses, net_profit, topProducts };
      }, [filteredTransactionsForDash, filteredExpensesForDash]);

      // Trigger Permintaan Batalkan Transaksi dari Kasir
      const triggerCancelTrx = (trx) => {
        setAppDialog({ isOpen: true, type: 'prompt', title: 'Permintaan Batalkan Transaksi', message: 'Masukkan alasan pembatalan:', promptValue: '', onConfirm: async (reason) => {
          if (!reason) return showToast('Alasan wajib diisi!', 'error');

          if (isOwner) {
            await executeCancellation(trx.id, reason);
          } else {
            const updatedTrxList = transactions.map(t => t.id === trx.id ? { ...t, status: 'PENDING_CANCEL', cancel_reason: reason, requested_by: currentUser.name } : t);
            setTransactions(updatedTrxList);

            const newNotif = {
              id: 'NOTIF-' + Date.now(),
              title: 'Permintaan Batal Transaksi',
              message: `Kasir ${currentUser.name} meminta pembatalan transaksi #${trx.id} (${formatCurrency(trx.total_amount)}). Alasan: ${reason}`,
              created_at: new Date().toISOString(),
              is_read: false,
              type: 'CANCEL_REQUEST',
              trx_id: trx.id,
              reason: reason
            };
            setNotifications([newNotif, ...notifications]);
            showToast('Permintaan pembatalan dikirim ke Owner untuk persetujuan.');
          }
        }});
      };

      const executeCancellation = async (trxId, reason) => {
        const targetTrx = transactions.find(t => t.id === trxId);
        if (!targetTrx) return;

        const item = targetTrx.items[0];
        if (item) {
          const prod = products.find(p => p.id === item.product_id);
          if (prod) {
            const revertDelta = targetTrx.type === 'SALE' ? item.qty : -item.qty;
            setProducts(products.map(p => p.id === prod.id ? { ...p, stock: p.stock + revertDelta } : p));
          }
        }
        setTransactions(transactions.map(t => t.id === trxId ? { ...t, status: 'CANCELLED', cancel_reason: reason } : t));
        
        const approveNotif = {
          id: 'NOTIF-' + Date.now(),
          title: 'Transaksi Dibatalkan',
          message: `Transaksi #${trxId} telah resmi disetujui dan dibatalkan.`,
          created_at: new Date().toISOString(),
          is_read: false,
          type: 'INFO'
        };
        setNotifications([approveNotif, ...notifications]);
        showToast('Transaksi berhasil dibatalkan dan disetujui.');
      };

      const handleApproveCancel = async (notif) => {
        await executeCancellation(notif.trx_id, notif.reason);
        setNotifications(notifications.map(n => n.id === notif.id ? { ...n, is_read: true, handled: true } : n));
        setSelectedNotifDetail(null);
      };

      const handleRejectCancel = (notif) => {
        setTransactions(transactions.map(t => t.id === notif.trx_id ? { ...t, status: 'COMPLETED' } : t));
        setNotifications(notifications.map(n => n.id === notif.id ? { ...n, is_read: true, handled: true } : n));
        setSelectedNotifDetail(null);
        showToast('Permintaan pembatalan ditolak.');
      };

      const submitUser = async (e) => {
        e.preventDefault();
        try {
          const payload = { 
            action: editingUser ? 'update_user' : 'register', 
            userId: editingUser ? editingUser.id : undefined,
            name: newUserForm.name, 
            email: newUserForm.email, 
            password: newUserForm.password, 
            role: newUserForm.role, 
            branch_id: newUserForm.branch_id 
          };
          const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
          const result = await res.json();
          if (result.status === 'success') {
            setShowAddUser(false);
            setEditingUser(null);
            setNewUserForm({ name: '', email: '', password: '', role: 'CASHIER', branch_id: 'b1' });
            showToast(editingUser ? 'Karyawan diperbarui!' : 'Karyawan ditambahkan!');
            await loadDataFromServer();
          } else { showToast(result.message, 'error'); }
        } catch(err) { showToast('Koneksi gagal', 'error'); }
      };

      const triggerDeleteUser = (id) => {
        setAppDialog({ isOpen: true, type: 'confirm', title: 'Hapus Karyawan', message: 'Yakin ingin menghapus akun karyawan ini?', onConfirm: async () => {
          setUsers(users.filter(u => u.id !== id));
          try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'delete_user', userId: id })) });
            await loadDataFromServer();
            showToast('Karyawan dihapus.');
          } catch(e) {}
        }});
      };

      const submitProduct = async (e) => {
        e.preventDefault();
        const newItem = { 
          id: 'PRD-' + Date.now().toString().slice(-6), 
          branch_id: isOwner ? 'ALL' : (currentUser.branch_id || 'b1'), 
          name: newProduct.name, 
          purchase_price: Number(newProduct.purchase_price), 
          selling_price: Number(newProduct.selling_price), 
          stock: Number(newProduct.stock)
        };
        setProducts([newItem, ...products]); 
        setShowAddProduct(false);
        setNewProduct({ name: '', purchase_price: '', selling_price: '', stock: '' });
        showToast('Produk disimpan.');
      };

      const submitTransaction = async (e) => {
        e.preventDefault();
        const prod = products.find(p => p.id === newTrx.product_id);
        if (!prod) return showToast('Pilih produk!', 'error');
        const qty = Number(newTrx.qty);
        
        if (newTrx.type === 'SALE' && getAvailableStock(prod, products) < qty) return showToast('Stok tidak mencukupi!', 'error');

        const baseAmt = newTrx.type === 'SALE' ? (prod.selling_price * qty) : (prod.purchase_price * qty);
        const fee = newTrx.type === 'SALE' ? Number(newTrx.admin_fee || 0) : 0;
        const totalAmt = baseAmt + fee;
        const trx = { id: 'TRX-' + Date.now().toString().slice(-6), branch_id: prod.branch_id === 'ALL' ? (currentUser.branch_id || 'b1') : prod.branch_id, user_id: currentUser.id, type: newTrx.type, total_amount: totalAmt, admin_fee: fee, status: 'COMPLETED', created_at: new Date().toISOString(), items: [{ product_id: prod.id, qty: qty, unit_price: prod.selling_price, unit_cost: prod.purchase_price, product_name: prod.name }] };

        setProducts(products.map(p => p.id === prod.id ? { ...p, stock: p.stock + (newTrx.type === 'PURCHASE' ? qty : -qty) } : p));
        setTransactions([trx, ...transactions]); 
        setShowAddTransaction(false); 
        showToast('Transaksi berhasil dicatat!');
      };

      const submitExpense = async (e) => {
        e.preventDefault();
        const exp = { id: 'EXP-' + Date.now().toString().slice(-6), branch_id: currentUser.branch_id || 'b1', amount: Number(newExp.amount), date: new Date().toISOString(), description: newExp.description };
        setExpenses([exp, ...expenses]); 
        setShowAddExpense(false);
        setNewExp({ description: '', amount: '' });
        showToast('Biaya operasional dicatat.');
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-100 dark:bg-[#070a14] flex items-center justify-center p-4">
            {toast && (
              <div className={`fixed top-4 right-4 p-4 rounded-2xl shadow-xl text-white z-50 text-xs font-bold ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                {toast.msg}
              </div>
            )}
            <div className="max-w-md w-full bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-800">
              <div className="text-center mb-8">
                <div className="w-12 h-12 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-xl font-black mb-4 shadow-lg shadow-blue-500/30">P</div>
                <h1 className="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Pro Finance POS</h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">Silakan masuk ke akun Anda</p>
              </div>
              <form onSubmit={handleAuthSubmit} className="space-y-4">
                <div>
                  <label className="block text-[10px] font-black text-slate-500 dark:text-slate-300 uppercase tracking-widest mb-1.5">Email</label>
                  <input type="email" required className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-600 outline-none text-xs font-bold" value={authForm.email} onChange={(e) => setAuthForm({...authForm, email: e.target.value})} placeholder="owner@toko.com" />
                </div>
                <div>
                  <label className="block text-[10px] font-black text-slate-500 dark:text-slate-300 uppercase tracking-widest mb-1.5">Kata Sandi</label>
                  <input type="password" required className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-blue-600 outline-none text-xs font-bold" value={authForm.password} onChange={(e) => setAuthForm({...authForm, password: e.target.value})} placeholder="••••••••" />
                </div>
                <button type="submit" className="w-full py-3.5 px-4 rounded-xl text-white font-extrabold text-xs bg-blue-600 hover:bg-blue-700 transition shadow-lg shadow-blue-500/25 cursor-pointer">
                  Masuk ke Sistem
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-50 dark:bg-[#0b0f19] font-sans text-slate-800 dark:text-slate-100 overflow-hidden">
          {toast && (
            <div className={`fixed top-4 right-4 p-4 rounded-2xl shadow-2xl text-white z-[99999] text-xs font-extrabold tracking-wide ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
              {toast.msg}
            </div>
          )}

          {mobileMenuOpen && (

                        <div>
                          <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Kata Sandi Lama</label>
                          <input type="password" placeholder="Kosongkan jika tidak ingin mengubah sandi" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold outline-none" value={profileForm.oldPassword} onChange={(e) => setProfileForm({...profileForm, oldPassword: e.target.value})} />
                        </div>
                        <div>
                          <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Kata Sandi Baru</label>
                          <input type="password" placeholder="Minimal 6 karakter" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold outline-none" value={profileForm.newPassword} onChange={(e) => setProfileForm({...profileForm, newPassword: e.target.value})} />
                        </div>
                      </div>
                    </div>

                    <button type="submit" className="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-xs shadow-md cursor-pointer">Simpan Perubahan</button>
                  </form>
                </div>
              )}
            </div>
          </main>

          {/* MODAL DETAIL NOTIFIKASI PEMBATALAN TRANSAKSI (UNTUK OWNER) */}
          {selectedNotifDetail && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] rounded-3xl w-full max-w-sm shadow-2xl border border-slate-100 dark:border-slate-800 overflow-hidden flex flex-col animate-modal">
                <div className="p-4 bg-slate-50 dark:bg-[#182030] border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
                  <h3 className="font-extrabold text-slate-900 dark:text-white text-xs uppercase tracking-wider">Persetujuan Pembatalan</h3>
                  <button onClick={() => setSelectedNotifDetail(null)} className="w-7 h-7 flex items-center justify-center bg-white dark:bg-slate-800 text-slate-500 rounded-full border border-slate-200 dark:border-slate-700 cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button>
                </div>

                <div className="p-5 space-y-4 text-xs">
                  <div>
                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Informasi Permintaan</p>
                    <p className="font-bold text-slate-900 dark:text-white text-sm">{selectedNotifDetail.message}</p>
                  </div>
                  <div className="bg-amber-500/10 p-3.5 rounded-xl border border-amber-500/20">
                    <p className="text-[10px] font-black text-amber-600 dark:text-amber-400 uppercase tracking-widest mb-1">Alasan Pembatalan dari Kasir:</p>
                    <p className="font-bold text-slate-800 dark:text-slate-200 text-xs italic">"{selectedNotifDetail.reason}"</p>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 dark:bg-[#182030] border-t border-slate-100 dark:border-slate-800 flex gap-2">
                  <button onClick={() => handleApproveCancel(selectedNotifDetail)} className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs flex items-center justify-center cursor-pointer shadow-md">
                    Setujui Pembatalan
                  </button>
                  <button onClick={() => handleRejectCancel(selectedNotifDetail)} className="flex-1 py-3 bg-rose-500/10 text-rose-500 hover:bg-rose-500/20 rounded-xl font-bold text-xs flex items-center justify-center cursor-pointer">
                    Tolak
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* DIALOG MODAL KONFIRMASI */}
          {appDialog.isOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] rounded-3xl w-full max-w-sm shadow-2xl animate-modal border border-slate-100 dark:border-slate-800 p-6">
                <h3 className="text-lg font-extrabold text-slate-900 dark:text-white mb-2">{appDialog.title}</h3>
                <p className="text-xs text-slate-600 dark:text-slate-400 mb-4 font-medium">{appDialog.message}</p>
                {appDialog.type === 'prompt' && (
                  <input type="text" className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white outline-none mb-6 text-xs" autoFocus
                    value={appDialog.promptValue} onChange={(e) => setAppDialog({...appDialog, promptValue: e.target.value})} placeholder="Ketik alasan pembatalan..." />
                )}
                <div className="flex space-x-2.5">
                  <button onClick={() => setAppDialog({...appDialog, isOpen: false})} className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl font-bold text-xs cursor-pointer">Batal</button>
                  <button onClick={() => { appDialog.onConfirm(appDialog.type === 'prompt' ? appDialog.promptValue : null); setAppDialog({...appDialog, isOpen: false}); }} className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md cursor-pointer">Konfirmasi</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL TAMBAH / EDIT KARYAWAN */}
          {showAddUser && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100 dark:border-slate-800">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="text-lg font-extrabold text-slate-900 dark:text-white">{editingUser ? 'Edit / Reset Sandi Karyawan' : 'Tambah Karyawan Baru'}</h3>
                  <button onClick={() => setShowAddUser(false)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button>
                </div>
                <form onSubmit={submitUser} className="space-y-3.5">
                  <div>
                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nama Lengkap</label>
                    <input type="text" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold outline-none" value={newUserForm.name} onChange={(e)=>setNewUserForm({...newUserForm, name: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Email Akses</label>
                    <input type="email" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold outline-none" value={newUserForm.email} onChange={(e)=>setNewUserForm({...newUserForm, email: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Kata Sandi Baru {editingUser && '(Opsional / Reset)'}</label>
                    <input type="password" {...(!editingUser ? {required: true} : {})} placeholder="••••••••" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold outline-none" value={newUserForm.password} onChange={(e)=>setNewUserForm({...newUserForm, password: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Peran / Jabatan</label>
                    <select className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold outline-none" value={newUserForm.role} onChange={(e)=>setNewUserForm({...newUserForm, role: e.target.value})}>
                      <option value="CASHIER">Kasir</option>
                      <option value="OWNER">Owner</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md hover:bg-blue-700 transition cursor-pointer">Simpan Karyawan</button>
                </form>
              </div>
            </div>
          )}

          {/* EXPENSE MODAL */}
          {showAddExpense && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100 dark:border-slate-800">
                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Catat Biaya Operasional</h3><button onClick={() => setShowAddExpense(false)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button></div>
                <form onSubmit={submitExpense} className="space-y-3.5">
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Keterangan Biaya</label><input type="text" required placeholder="Cth: Listrik" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newExp.description} onChange={(e)=>setNewExp({...newExp, description: e.target.value})} /></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nominal (Rp)</label><input type="number" min="1" required placeholder="Cth: 150000" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newExp.amount} onChange={(e)=>setNewExp({...newExp, amount: e.target.value})} /></div>
                  <button type="submit" className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md cursor-pointer">Simpan Biaya</button>
                </form>
              </div>
            </div>
          )}

          {/* TRANSACTION MODAL */}
          {showAddTransaction && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100 dark:border-slate-800">
                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Catat Transaksi</h3><button onClick={() => setShowAddTransaction(false)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button></div>
                <form onSubmit={submitTransaction} className="space-y-3.5">
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Tipe</label><select className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newTrx.type} onChange={(e)=>setNewTrx({...newTrx, type: e.target.value})}><option value="SALE">Penjualan</option><option value="PURCHASE">Pembelian Stok</option></select></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Produk</label><select required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newTrx.product_id} onChange={(e)=>setNewTrx({...newTrx, product_id: e.target.value})}><option value="">Pilih Produk...</option>{filteredProducts.map(p => <option key={p.id} value={p.id}>{p.name} (Stok: {p.stock})</option>)}</select></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Jumlah Qty</label><input type="number" min="1" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newTrx.qty} onChange={(e)=>setNewTrx({...newTrx, qty: e.target.value})} /></div>
                  <button type="submit" className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md cursor-pointer">Simpan Transaksi</button>
                </form>
              </div>
            </div>
          )}

          {/* ADD PRODUCT MODAL */}
          {showAddProduct && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100 dark:border-slate-800">
                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Produk Baru</h3><button onClick={() => setShowAddProduct(false)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button></div>
                <form onSubmit={submitProduct} className="space-y-3.5">
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nama Produk</label><input type="text" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.name} onChange={(e)=>setNewProduct({...newProduct, name: e.target.value})} /></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Stok Awal</label><input type="number" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.stock} onChange={(e)=>setNewProduct({...newProduct, stock: e.target.value})} /></div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Modal (Rp)</label><input type="number" required className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.purchase_price} onChange={(e)=>setNewProduct({...newProduct, purchase_price: e.target.value})} /></div>
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Jual (Rp)</label><input type="number" required className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.selling_price} onChange={(e)=>setNewProduct({...newProduct, selling_price: e.target.value})} /></div>
                  </div>
                  <button type="submit" className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md cursor-pointer">Simpan Produk</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

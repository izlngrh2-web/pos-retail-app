<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Finance - Modern Financial & POS</title>
  
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8653/8653200.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          boxShadow: {
            'modern': '0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 0 1px 1px rgba(15, 23, 42, 0.04)',
            'card': '0 4px 20px -2px rgba(15, 23, 42, 0.03)',
            'dark-card': '0 4px 20px -2px rgba(0, 0, 0, 0.3)',
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { overflow-x: hidden; touch-action: manipulation; }
    button, input, select { cursor: pointer; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .animate-modal { animation: fadeInScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @media print {
      body * { visibility: hidden !important; }
      #printable-receipt, #printable-receipt *, #printable-pdf-report, #printable-pdf-report * { visibility: visible !important; }
      #printable-receipt, #printable-pdf-report {
        position: absolute; left: 0; top: 0; width: 100%; max-width: 100%;
        box-shadow: none !important; border: none !important; padding: 20px !important; margin: 0 !important;
        background: white !important; color: black !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-300">
  <div id="root"></div>

  <script>
    window.addEventListener('error', function(e) {
      const root = document.getElementById('root');
      if (root && root.innerHTML.trim() === '') {
        root.innerHTML = `<div style="padding: 40px; font-family: sans-serif; color: #dc2626;"><h3>Terjadi Kesalahan Saat Memuat Aplikasi</h3><p>${e.message} (Line: ${e.lineno})</p></div>`;
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker terdaftar!', reg.scope))
          .catch(err => console.log('Gagal mendaftar Service Worker:', err));
      });
    }
  </script>

  <script type="text/babel">
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrA-dYXQnCgsEYPHdDgEpVGYqvo9K_HnmzNGHr5TH6F9bTwxMpf5r4LDPJVvmUixE/exec';

    function timeAgo(dateString) {
      const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + " thn";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + " bln";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + " hr";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + " jam";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + " mnt";
      return "Baru saja";
    }

    function App() {
      const [isAuthenticated, setIsAuthenticated] = React.useState(() => localStorage.getItem('pos_is_auth') === 'true');
      const [currentUser, setCurrentUser] = React.useState(() => {
        const saved = localStorage.getItem('pos_current_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [themeMode, setThemeMode] = React.useState(() => localStorage.getItem('pos_theme_mode') || 'dark');
      const [authView, setAuthView] = React.useState('login'); // 'login' | 'register'
      const [isLoading, setIsLoading] = React.useState(false);
      
      const [branches, setBranches] = React.useState([]);
      const [users, setUsers] = React.useState([]);
      const [notifications, setNotifications] = React.useState(() => {
        const saved = localStorage.getItem('pos_notifications');
        return saved ? JSON.parse(saved) : [
          { id: 'n1', title: 'Sistem Aktif', message: 'Selamat datang di Pro Finance Enterprise.', created_at: new Date().toISOString(), is_read: false, type: 'INFO' }
        ];
      });

      const [authForm, setAuthForm] = React.useState({ name: '', email: '', password: '', role: 'OWNER', branch_id: '', store_name: '', spreadsheet_id: '', oldPassword: '', newPassword: '' });
      const [profileForm, setProfileForm] = React.useState({ name: currentUser?.name || '', oldPassword: '', newPassword: '', avatar: currentUser?.avatar || '', spreadsheet_id: currentUser?.spreadsheet_id || '', avatarChanged: false });
      const avatarInputRef = React.useRef(null);

      const [currentView, setCurrentView] = React.useState('dashboard');
      const [toast, setToast] = React.useState(null);
      const [isExporting, setIsExporting] = React.useState(false);
      const [isRefreshing, setIsRefreshing] = React.useState(false);

      const currentDate = new Date();
      const [dashboardFilterMode, setDashboardFilterMode] = React.useState('monthly');
      const [selectedMonth, setSelectedMonth] = React.useState(currentDate.getMonth());
      const [selectedYear, setSelectedYear] = React.useState(currentDate.getFullYear());
      const [dashboardBranchFilter, setDashboardBranchFilter] = React.useState('ALL');

      const [products, setProducts] = React.useState(() => { const saved = localStorage.getItem('pos_products'); return saved ? JSON.parse(saved) : []; });
      const [transactions, setTransactions] = React.useState(() => { const saved = localStorage.getItem('pos_transactions'); return saved ? JSON.parse(saved) : []; });
      const [expenses, setExpenses] = React.useState(() => { const saved = localStorage.getItem('pos_expenses'); return saved ? JSON.parse(saved) : []; });

      const [selectedReceiptTrx, setSelectedReceiptTrx] = React.useState(null);
      const [isGeneratingImage, setIsGeneratingImage] = React.useState(false);
      const receiptRef = React.useRef(null);

      const [editingProduct, setEditingProduct] = React.useState(null);
      const [editingTrx, setEditingTrx] = React.useState(null);
      const [appDialog, setAppDialog] = React.useState({ isOpen: false, type: 'confirm', title: '', message: '', promptValue: '', onConfirm: null });
      const [newStoreModal, setNewStoreModal] = React.useState({ isOpen: false, url: '' });

      const [showAddProduct, setShowAddProduct] = React.useState(false);
      const [newProduct, setNewProduct] = React.useState({ name: '', purchase_price: '', selling_price: '', stock: '', master_id: '', yield_per_master: 1 });
      const [showAddTransaction, setShowAddTransaction] = React.useState(false);
      const [newTrx, setNewTrx] = React.useState({ type: 'SALE', product_id: '', qty: 1, admin_fee: 0 });
      const [showAddExpense, setShowAddExpense] = React.useState(false);
      const [newExp, setNewExp] = React.useState({ description: '', amount: '' });
      const [showAddBranch, setShowAddBranch] = React.useState(false);
      const [newBranch, setNewBranch] = React.useState({ name: '', location: '' });
      const [showAddUser, setShowAddUser] = React.useState(false);
      const [newUserForm, setNewUserForm] = React.useState({ name: '', email: '', password: '', role: 'CASHIER', branch_id: '' });

      const getAvailableStock = (product, allProducts) => {
        if (product.master_id) {
          const master = allProducts.find(p => p.id === product.master_id);
          if (master) return Math.floor(master.stock * (product.yield_per_master || 1));
          return 0;
        }
        return Math.round(product.stock * 100) / 100;
      };

      React.useEffect(() => {
        const rootHtml = document.documentElement;
        if (themeMode === 'dark') {
          rootHtml.classList.add('dark');
        } else {
          rootHtml.classList.remove('dark');
        }
        localStorage.setItem('pos_theme_mode', themeMode);
      }, [themeMode]);

      React.useEffect(() => {
        localStorage.setItem('pos_notifications', JSON.stringify(notifications));
      }, [notifications]);

      const getPayloadWithAuth = (basePayload) => {
        return {
          ...basePayload,
          currentUserEmail: currentUser?.email || '',
          spreadsheetId: currentUser?.spreadsheet_id || ''
        };
      };

      React.useEffect(() => {
        if (currentUser?.spreadsheet_id) {
          fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_branches' })) })
            .then(res => res.json())
            .then(res => { if(res.status === 'success') setBranches(res.data); });
        }
      }, [currentUser]);

      const loadDataFromServer = async () => {
        if (!currentUser?.spreadsheet_id) return;
        try {
          const resProd = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_products' })) });
          const resultProd = await resProd.json();
          if (resultProd.status === 'success') setProducts(resultProd.data);

          const resTrx = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_transactions' })) });
          const resultTrx = await resTrx.json();
          if (resultTrx.status === 'success') setTransactions(resultTrx.data);

          const resExp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_expenses' })) });
          const resultExp = await resExp.json();
          if (resultExp.status === 'success') setExpenses(resultExp.data);

          if (currentUser?.role === 'OWNER') {
            const resUsers = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_users' })) });
            const resultUsers = await resUsers.json();
            if (resultUsers.status === 'success') setUsers(resultUsers.data);

            const resBranch = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'get_branches' })) });
            const resultBranch = await resBranch.json();
            if (resultBranch.status === 'success') setBranches(resultBranch.data);
          }
        } catch (error) {
          console.error("Gagal memuat data", error);
        }
      };

      React.useEffect(() => { if (isAuthenticated && currentUser?.spreadsheet_id) loadDataFromServer(); }, [isAuthenticated, currentUser?.spreadsheet_id]);

      React.useEffect(() => { localStorage.setItem('pos_products', JSON.stringify(products)); }, [products]);
      React.useEffect(() => { localStorage.setItem('pos_transactions', JSON.stringify(transactions)); }, [transactions]);
      React.useEffect(() => { localStorage.setItem('pos_expenses', JSON.stringify(expenses)); }, [expenses]);
      React.useEffect(() => {
        localStorage.setItem('pos_is_auth', isAuthenticated);
        if (currentUser) localStorage.setItem('pos_current_user', JSON.stringify(currentUser));
        else localStorage.removeItem('pos_current_user');
      }, [isAuthenticated, currentUser]);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount || 0);
      };

      const handleRefreshCatalog = async () => {
        setIsRefreshing(true);
        showToast('Menyinkronkan data dengan Google Sheets...', 'info');
        await loadDataFromServer();
        setIsRefreshing(false);
        showToast('Data berhasil diperbarui!');
      };

      const handleAuthSubmit = async (e, actionType) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          let payload = { action: actionType };
          if (actionType === 'login') {
            payload = { ...payload, email: authForm.email, password: authForm.password };
          } else if (actionType === 'register') {
            payload = { 
              ...payload, 
              name: authForm.name, 
              email: authForm.email, 
              password: authForm.password, 
              role: authForm.role, 
              branch_id: authForm.role === 'OWNER' ? '' : authForm.branch_id,
              store_name: authForm.store_name,
              spreadsheet_id: authForm.spreadsheet_id || '' 
            };
          }

          const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
          const result = await response.json();

          if (result.status === 'success') {
            if (actionType === 'login') {
              setCurrentUser(result.data);
              setProfileForm({ ...profileForm, name: result.data.name, avatar: result.data.avatar || '', spreadsheet_id: result.data.spreadsheet_id || '' });
              setIsAuthenticated(true);
              setCurrentView('dashboard');
              showToast(`Selamat datang, ${result.data.name}!`);
            } else if (actionType === 'register') {
              showToast('Pendaftaran berhasil! Silakan masuk.');
              if (result.spreadsheet_url) setNewStoreModal({ isOpen: true, url: result.spreadsheet_url });
              setAuthView('login');
              setAuthForm(prev => ({ ...prev, password: '' }));
            }
          } else {
            showToast(result.message || 'Terjadi kesalahan.', 'error');
          }
        } catch (error) { showToast('Koneksi server gagal.', 'error'); } finally { setIsLoading(false); }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setCurrentUser(null);
        localStorage.removeItem('pos_is_auth');
        localStorage.removeItem('pos_current_user');
        showToast('Berhasil keluar.');
      };

      const handleAvatarChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 200; const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            setProfileForm({ ...profileForm, avatar: canvas.toDataURL('image/jpeg', 0.7), avatarChanged: true });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const submitProfileUpdate = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          const payload = { 
            action: 'update_profile', 
            email: currentUser.email, 
            name: profileForm.name, 
            spreadsheet_id: profileForm.spreadsheet_id,
            avatar: profileForm.avatarChanged ? profileForm.avatar : null, 
            oldPassword: profileForm.oldPassword, 
            newPassword: profileForm.newPassword 
          };
          const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
          const result = await response.json();
          if (result.status === 'success') {
            setCurrentUser(result.data);
            setProfileForm(prev => ({ ...prev, oldPassword: '', newPassword: '', avatarChanged: false }));
            showToast('Profil & Password berhasil diperbarui!');
          } else { showToast(result.message, 'error'); }
        } catch (error) { showToast('Koneksi server gagal.', 'error'); } finally { setIsLoading(false); }
      };

      const isOwner = currentUser?.role === 'OWNER';
      const activeBranchId = isOwner ? (dashboardBranchFilter === 'ALL' ? null : dashboardBranchFilter) : currentUser?.branch_id;
      const dataViewBranchId = isOwner ? null : currentUser?.branch_id;
      
      const filteredProducts = isOwner ? products : products.filter(p => p.branch_id === dataViewBranchId);
      const viewTransactions = (isOwner ? transactions : transactions.filter(t => t.branch_id === dataViewBranchId)).filter(t => t.status === 'COMPLETED');
      const viewExpenses = isOwner ? expenses : expenses.filter(e => e.branch_id === dataViewBranchId);

      const filteredTransactionsForDash = React.useMemo(() => {
        return transactions.filter(t => {
          if (t.status !== 'COMPLETED') return false;
          if (activeBranchId && t.branch_id !== activeBranchId) return false;
          const d = new Date(t.created_at);
          const matchYear = d.getFullYear() === Number(selectedYear);
          if (dashboardFilterMode === 'yearly') return matchYear;
          return matchYear && d.getMonth() === Number(selectedMonth);
        });
      }, [transactions, activeBranchId, dashboardFilterMode, selectedMonth, selectedYear]);

      const filteredExpensesForDash = React.useMemo(() => {
        return expenses.filter(e => {
          if (activeBranchId && e.branch_id !== activeBranchId) return false;
          const d = new Date(e.date);
          const matchYear = d.getFullYear() === Number(selectedYear);
          if (dashboardFilterMode === 'yearly') return matchYear;
          return matchYear && d.getMonth() === Number(selectedMonth);
        });
      }, [expenses, activeBranchId, dashboardFilterMode, selectedMonth, selectedYear]);

      const prevPeriodData = React.useMemo(() => {
        let p_sales = 0, p_cogs = 0, p_admin = 0, p_exp = 0, p_order_count = 0;
        const isYearly = dashboardFilterMode === 'yearly';
        const targetPrevYear = isYearly ? selectedYear - 1 : (selectedMonth === 0 ? selectedYear - 1 : selectedYear);
        const targetPrevMonth = isYearly ? null : (selectedMonth === 0 ? 11 : selectedMonth - 1);

        transactions.forEach(t => {
            if (t.status !== 'COMPLETED') return;
            if (activeBranchId && t.branch_id !== activeBranchId) return;
            const d = new Date(t.created_at);
            const mYear = d.getFullYear() === targetPrevYear;
            const mMonth = isYearly || d.getMonth() === targetPrevMonth;

            if (mYear && mMonth) {
                if (t.type === 'SALE') {
                    p_sales += t.total_amount;
                    p_admin += (Number(t.admin_fee) || 0);
                    p_order_count++;
                    t.items.forEach(item => p_cogs += (item.qty * item.unit_cost));
                }
            }
        });

        expenses.forEach(e => {
            if (activeBranchId && e.branch_id !== activeBranchId) return;
            const d = new Date(e.date);
            const mYear = d.getFullYear() === targetPrevYear;
            const mMonth = isYearly || d.getMonth() === targetPrevMonth;
            if (mYear && mMonth) p_exp += Number(e.amount);
        });

        const p_profit = p_sales - p_cogs - p_admin - p_exp;
        const p_avg_order = p_order_count > 0 ? (p_sales / p_order_count) : 0;
        return { p_sales, p_profit, p_order_count, p_avg_order };
      }, [transactions, expenses, activeBranchId, dashboardFilterMode, selectedMonth, selectedYear]);

      const dashStatsExt = React.useMemo(() => {
        let total_sales = 0, cogs = 0, admin_fee = 0, total_purchases = 0, order_count = 0;
        const topSalesMap = {};

        filteredTransactionsForDash.forEach(t => {
            if (t.type === 'SALE') {
                total_sales += t.total_amount;
                admin_fee += (Number(t.admin_fee) || 0);
                order_count++;
                t.items.forEach(item => { 
                    cogs += (item.qty * item.unit_cost);
                    if(!topSalesMap[item.product_name]) topSalesMap[item.product_name] = { name: item.product_name, qty: 0, total: 0 };
                    topSalesMap[item.product_name].qty += item.qty;
                    topSalesMap[item.product_name].total += (item.qty * item.unit_price);
                });
            } else if (t.type === 'PURCHASE') {
                total_purchases += t.total_amount;
            }
        });
        
        const total_operational_expenses = filteredExpensesForDash.reduce((sum, exp) => sum + Number(exp.amount), 0);
        const net_profit = total_sales - cogs - admin_fee - total_operational_expenses;
        const avg_order = order_count > 0 ? (total_sales / order_count) : 0;
        const topProducts = Object.values(topSalesMap).sort((a,b) => b.total - a.total).slice(0, 5);
        const maxProdSales = topProducts.length > 0 ? topProducts[0].total : 1;
        const recentTrx = [...filteredTransactionsForDash].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);

        return { total_sales, cogs, admin_fee, total_operational_expenses, total_purchases, net_profit, order_count, avg_order, topProducts, maxProdSales, recentTrx };
      }, [filteredTransactionsForDash, filteredExpensesForDash]);

      const renderTrend = (current, prev) => {
        if (prev === 0 && current === 0) return <span className="text-slate-400 font-medium ml-2">-</span>;
        const pct = prev === 0 ? 100 : ((current - prev) / prev) * 100;
        const isPos = pct >= 0;
        return (
            <span className={`text-[11px] font-bold flex items-center ml-2 px-1.5 py-0.5 rounded-md ${isPos ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                <i className={`ph-bold ${isPos ? 'ph-trend-up' : 'ph-trend-down'} mr-0.5`}></i>
                {Math.abs(pct).toFixed(1)}%
            </span>
        );
      }

      const dailyChartData = React.useMemo(() => {
        const daysMap = {};
        let maxDays = 31;
        if (dashboardFilterMode === 'monthly') {
          maxDays = new Date(selectedYear, Number(selectedMonth) + 1, 0).getDate();
          for (let d = 1; d <= maxDays; d++) daysMap[d] = { label: d, revenue: 0 };
        } else {
          const ms = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
          for (let m = 0; m < 12; m++) daysMap[m + 1] = { label: ms[m], revenue: 0 };
        }

        filteredTransactionsForDash.filter(t => t.type === 'SALE').forEach(t => {
          const d = new Date(t.created_at);
          const key = dashboardFilterMode === 'monthly' ? d.getDate() : d.getMonth() + 1;
          if (daysMap[key]) daysMap[key].revenue += t.total_amount;
        });
        return Object.values(daysMap);
      }, [filteredTransactionsForDash, dashboardFilterMode, selectedMonth, selectedYear]);

      const maxChartVal = React.useMemo(() => {
        let m = 10000;
        dailyChartData.forEach(item => { if (item.revenue > m) m = item.revenue; });
        return m * 1.15; 
      }, [dailyChartData]);

      const submitProduct = async (e) => {
        e.preventDefault();
        const newItem = { 
          id: 'PRD-' + Date.now().toString().slice(-6), 
          branch_id: currentUser.branch_id || 'b1', 
          name: newProduct.name, 
          purchase_price: Number(newProduct.purchase_price), 
          selling_price: Number(newProduct.selling_price), 
          stock: newProduct.master_id ? 0 : Number(newProduct.stock),
          master_id: newProduct.master_id || null,
          yield_per_master: Number(newProduct.yield_per_master) || 1
        };
        setProducts([newItem, ...products]); setShowAddProduct(false);
        setNewProduct({ name: '', purchase_price: '', selling_price: '', stock: '', master_id: '', yield_per_master: 1 });
        showToast('Menyimpan produk...');
        try { await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'add_product', product: newItem })) }); } catch (err) {}
      };

      const submitEditProduct = async (e) => {
        e.preventDefault();
        if (!editingProduct) return;
        const updatedItem = { 
          ...editingProduct, 
          purchase_price: Number(editingProduct.purchase_price), 
          selling_price: Number(editingProduct.selling_price), 
          stock: editingProduct.master_id ? 0 : Number(editingProduct.stock),
          master_id: editingProduct.master_id || null,
          yield_per_master: Number(editingProduct.yield_per_master) || 1
        };

      const submitTransaction = async (e) => {
        e.preventDefault();
        const prod = products.find(p => p.id === newTrx.product_id);
        if (!prod) return showToast('Pilih produk!', 'error');
        const qty = Number(newTrx.qty);
        
        const currentAvailable = getAvailableStock(prod, products);
        if (newTrx.type === 'SALE' && currentAvailable < qty) return showToast('Stok tidak mencukupi!', 'error');

        const baseAmt = newTrx.type === 'SALE' ? (prod.selling_price * qty) : (prod.purchase_price * qty);
        const fee = newTrx.type === 'SALE' ? Number(newTrx.admin_fee || 0) : 0;
        const totalAmt = baseAmt + fee;
        const trx = { id: 'TRX-' + Date.now().toString().slice(-6), branch_id: prod.branch_id, user_id: currentUser.id, type: newTrx.type, total_amount: totalAmt, admin_fee: fee, status: 'COMPLETED', created_at: new Date().toISOString(), items: [{ product_id: prod.id, qty: qty, unit_price: prod.selling_price, unit_cost: prod.purchase_price, product_name: prod.name }] };

        let targetId = prod.id;
        let consumedQty = qty;
        if (prod.master_id) {
          targetId = prod.master_id;
          consumedQty = qty / (prod.yield_per_master || 1);
        }
        const stockDelta = newTrx.type === 'PURCHASE' ? consumedQty : -consumedQty;

        setProducts(products.map(p => p.id === targetId ? { ...p, stock: Math.round((p.stock + stockDelta) * 100) / 100 } : p));
        setTransactions([trx, ...transactions]); setShowAddTransaction(false); showToast('Transaksi berhasil dicatat & stok diperbarui!');
        try { await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(getPayloadWithAuth({ action: 'add_transaction', transaction: trx })) }); } catch(err) {}
      };

      const submitEditTransaction = async (e) => {
        e.preventDefault();
        if (!editingTrx) return;
        const prod = products.find(p => p.id === editingTrx.product_id);
        if (!prod) return showToast('Pilih produk!', 'error');
        const qty = Number(editingTrx.qty);
        const baseAmt = editingTrx.type === 'SALE' ? (prod.selling_price * qty) : (prod.purchase_price * qty);
        const fee = editingTrx.type === 'SALE' ? Number(editingTrx.admin_fee || 0) : 0;
        const totalAmt = baseAmt + fee;
        const oldTrx = transactions.find(t => t.id === editingTrx.id); if (!oldTrx) return;

        const oldItem = oldTrx.items[0];
        const oldProd = products.find(p => p.id === oldItem?.product_id);
        if (oldProd && oldItem) {
          let oldTargetId = oldProd.id;
          let oldConsumed = oldItem.qty;
          if (oldProd.master_id) {
            oldTargetId = oldProd.master_id;
            oldConsumed = oldItem.qty / (oldProd.yield_per_master || 1);
          }
          const oldRevertDelta = oldTrx.type === 'PURCHASE' ? -oldConsumed : oldConsumed;
          
          let newTargetId = prod.id;
          let newConsumed = qty;
          if (prod.master_id) {
            newTargetId = prod.master_id;
            newConsumed = qty / (prod.yield_per_master || 1);
          }
          const newApplyDelta = editingTrx.type === 'PURCHASE' ? newConsumed : -newConsumed;

          setProducts(products.map(p => {
            if (p.id === oldTargetId && p.id === newTargetId) {
              return { ...p, stock: Math.round((p.stock + oldRevertDelta + newApplyDelta) * 100) / 100 };
            }
            if (p.id === oldTargetId) {
              return { ...p, stock: Math.round((p.stock + oldRevertDelta) * 100) / 100 };
            }
            if (p.id === newTargetId) {
              return { ...p, stock: Math.round((p.stock + newApplyDelta) * 100) / 100 };
            }
            return p;
          }));
        }

        const updatedTrx = { ...oldTrx, type: editingTrx.type, total_amount: totalAmt, admin_fee: fee, items: [{ product_id: prod.id, qty: qty, unit_price: prod.selling_price, unit_cost: prod.purchase_price, product_name: prod.name }] };

            executeCancellation(trx.id, reason);

            const updatedTrxList = transactions.map(t => t.id === trx.id ? { ...t, status: 'PENDING_CANCEL', cancel_reason: reason, requested_by: currentUser.name } : t);
            setTransactions(updatedTrxList);

              title: 'Permintaan Batal Transaksi',

            setNotifications([newNotif, ...notifications]);

            let consumed = item.qty;
            if (prod.master_id) {
              targetId = prod.master_id;

            }
            const revertDelta = targetTrx.type === 'SALE' ? consumed : -consumed;
            setProducts(products.map(p => p.id === targetId ? { ...p, stock: Math.round((p.stock + revertDelta) * 100) / 100 } : p));
          }
        }
        setTransactions(transactions.map(t => t.id === trxId ? { ...t, status: 'CANCELLED', cancel_reason: reason } : t));

          message: `Transaksi #${trxId} telah resmi dibatalkan.`,

                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Edit Transaksi</h3><button onClick={() => setEditingTrx(null)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button></div>
                <form onSubmit={submitEditTransaction} className="space-y-3.5">
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Tipe</label><select className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingTrx.type} onChange={(e)=>setEditingTrx({...editingTrx, type: e.target.value})}><option value="SALE">Penjualan</option><option value="PURCHASE">Pembelian Stok</option></select></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Produk</label><select required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingTrx.product_id} onChange={(e)=>setEditingTrx({...editingTrx, product_id: e.target.value})}><option value="">Pilih...</option>{filteredProducts.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Qty</label><input type="number" min="1" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingTrx.qty} onChange={(e)=>setEditingTrx({...editingTrx, qty: e.target.value})} /></div>
                  {editingTrx.type === 'SALE' && (
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Biaya Admin (Rp)</label><input type="number" min="0" placeholder="0" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingTrx.admin_fee} onChange={(e)=>setEditingTrx({...editingTrx, admin_fee: e.target.value})} /></div>
                  )}
                  <button type="submit" className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md hover:bg-blue-700 transition cursor-pointer">Simpan Perubahan</button>
                </form>
              </div>
            </div>
          )}

          {/* RECEIPT PREVIEW MODAL */}
          {selectedReceiptTrx && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] rounded-3xl w-full max-w-sm shadow-2xl border border-slate-100 dark:border-slate-800 overflow-hidden flex flex-col max-h-[90vh]">
                <div className="p-4 bg-slate-50 dark:bg-[#182030] border-b border-slate-100 dark:border-slate-800 flex justify-between items-center no-print">
                  <h3 className="font-bold text-slate-900 dark:text-white text-xs uppercase tracking-wider">Pratinjau Struk</h3>
                  <button onClick={() => setSelectedReceiptTrx(null)} className="w-7 h-7 flex items-center justify-center bg-white dark:bg-slate-800 text-slate-500 rounded-full border border-slate-200 dark:border-slate-700 cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button>
                </div>
                <div className="p-6 overflow-y-auto flex-1 bg-slate-100 dark:bg-[#0b0f19] flex justify-center">
                  <div ref={receiptRef} id="printable-receipt" className="bg-white p-6 w-[320px] shadow-sm font-mono text-xs text-slate-800 space-y-3 rounded-xl border border-slate-200">
                    <div className="text-center pb-3 border-b border-dashed border-slate-200">
                      <h4 className="font-black text-sm uppercase tracking-wider text-slate-900">PRO FINANCE</h4>
                      <p className="text-[10px] text-slate-500 mt-0.5">{branches.find(b => b.id === selectedReceiptTrx.branch_id)?.name || 'Cabang'}</p>
                      <p className="text-[10px] text-slate-400 mt-1">ID: {selectedReceiptTrx.id}</p>
                      <p className="text-[10px] text-slate-400">{new Date(selectedReceiptTrx.created_at).toLocaleString('id-ID')}</p>
                    </div>
                    <div className="space-y-2 py-1">
                      {selectedReceiptTrx.items.map((item, idx) => (
                        <div key={idx} className="flex justify-between items-start">
                          <div className="flex-1 pr-2"><p className="font-bold text-slate-900">{item.product_name}</p><p className="text-[10px] text-slate-500">{item.qty} x {formatCurrency(item.unit_price)}</p></div>
                          <span className="font-bold">{formatCurrency(item.qty * item.unit_price)}</span>
                        </div>
                      ))}
                    </div>
                    <div className="pt-3 border-t border-dashed border-slate-200 space-y-1 text-xs">
                      {selectedReceiptTrx.admin_fee > 0 && ( <div className="flex justify-between text-slate-500"><span>Biaya Admin</span><span>{formatCurrency(selectedReceiptTrx.admin_fee)}</span></div> )}
                      <div className="flex justify-between font-black text-sm text-slate-900 pt-1 border-t border-slate-200"><span>TOTAL</span><span>{formatCurrency(selectedReceiptTrx.total_amount)}</span></div>
                    </div>
                  </div>
                </div>
                <div className="p-4 bg-white dark:bg-[#121824] border-t border-slate-100 dark:border-slate-800 flex gap-2.5 no-print">
                  <button onClick={() => window.print()} className="flex-1 py-3 px-4 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-xl font-bold text-xs transition flex items-center justify-center cursor-pointer"><i className="ph-bold ph-printer mr-1.5"></i> Cetak</button>
                  <button onClick={handleShareReceipt} disabled={isGeneratingImage} className="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs transition flex items-center justify-center cursor-pointer">{isGeneratingImage ? <i className="ph ph-spinner animate-spin mr-1.5"></i> : <i className="ph-bold ph-share-network mr-1.5"></i>} Bagikan</button>
                </div>
              </div>
            </div>
          )}

          {/* ADD PRODUCT MODAL */}
          {showAddProduct && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100 dark:border-slate-800 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Produk Baru / Varian</h3><button onClick={() => setShowAddProduct(false)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button></div>
                <form onSubmit={submitProduct} className="space-y-3.5">
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nama Produk</label><input type="text" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.name} onChange={(e)=>setNewProduct({...newProduct, name: e.target.value})} /></div>
                  
                  <div>
                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Produk Master (Opsional untuk Varian)</label>
                    <select className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold cursor-pointer" value={newProduct.master_id} onChange={(e)=>setNewProduct({...newProduct, master_id: e.target.value})}>
                      <option value="">-- Produk Mandiri (Bukan Varian) --</option>
                      {filteredProducts.filter(p => !p.master_id).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                    </select>
                  </div>

                  {newProduct.master_id ? (
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Yield / Isi per Master</label><input type="number" step="0.1" min="0.1" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.yield_per_master} onChange={(e)=>setNewProduct({...newProduct, yield_per_master: e.target.value})} /></div>
                  ) : (
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Stok Awal</label><input type="number" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.stock} onChange={(e)=>setNewProduct({...newProduct, stock: e.target.value})} /></div>
                  )}

                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Modal (Rp)</label><input type="number" required className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.purchase_price} onChange={(e)=>setNewProduct({...newProduct, purchase_price: e.target.value})} /></div>
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Jual (Rp)</label><input type="number" required className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newProduct.selling_price} onChange={(e)=>setNewProduct({...newProduct, selling_price: e.target.value})} /></div>
                  </div>
                  <button type="submit" className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md hover:bg-blue-700 transition cursor-pointer">Simpan ke Katalog</button>
                </form>
              </div>
            </div>
          )}

          {/* EDIT PRODUCT MODAL */}
          {editingProduct && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100 dark:border-slate-800 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Edit Produk / Varian</h3><button onClick={() => setEditingProduct(null)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button></div>
                <form onSubmit={submitEditProduct} className="space-y-3.5">
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nama</label><input type="text" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingProduct.name} onChange={(e)=>setEditingProduct({...editingProduct, name: e.target.value})} /></div>
                  
                  <div>
                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Produk Master</label>
                    <select className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold cursor-pointer" value={editingProduct.master_id || ''} onChange={(e)=>setEditingProduct({...editingProduct, master_id: e.target.value || null})}>
                      <option value="">-- Produk Mandiri --</option>
                      {filteredProducts.filter(p => p.id !== editingProduct.id && !p.master_id).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                    </select>
                  </div>

                  {editingProduct.master_id ? (
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Yield per Master</label><input type="number" step="0.1" min="0.1" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingProduct.yield_per_master || 1} onChange={(e)=>setEditingProduct({...editingProduct, yield_per_master: e.target.value})} /></div>
                  ) : (
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Stok</label><input type="number" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingProduct.stock} onChange={(e)=>setEditingProduct({...editingProduct, stock: e.target.value})} /></div>
                  )}

                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Modal</label><input type="number" required className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingProduct.purchase_price} onChange={(e)=>setEditingProduct({...editingProduct, purchase_price: e.target.value})} /></div>
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Jual</label><input type="number" required className="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={editingProduct.selling_price} onChange={(e)=>setEditingProduct({...editingProduct, selling_price: e.target.value})} /></div>
                  </div>
                  <button type="submit" className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md hover:bg-blue-700 transition cursor-pointer">Simpan Perubahan</button>
                </form>
              </div>
            </div>
          )}

          {/* ADD BRANCH MODAL */}
          {showAddBranch && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100 dark:border-slate-800">
                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Tambah Cabang</h3><button onClick={() => setShowAddBranch(false)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button></div>
                <form onSubmit={submitBranch} className="space-y-3.5">
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nama Cabang</label><input type="text" required placeholder="Cth: Cabang Selatan" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newBranch.name} onChange={(e)=>setNewBranch({...newBranch, name: e.target.value})} /></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Lokasi</label><input type="text" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newBranch.location} onChange={(e)=>setNewBranch({...newBranch, location: e.target.value})} /></div>
                  <button type="submit" className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md hover:bg-blue-700 transition cursor-pointer">Simpan Cabang</button>
                </form>
              </div>
            </div>
          )}

          {/* ADD USER MODAL */}
          {showAddUser && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white dark:bg-[#121824] p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100 dark:border-slate-800">
                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Tambah Karyawan</h3><button onClick={() => setShowAddUser(false)} className="w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-full cursor-pointer"><i className="ph-bold ph-x text-xs"></i></button></div>
                <form onSubmit={submitUser} className="space-y-3.5">
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Nama</label><input type="text" required className="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newUserForm.name} onChange={(e)=>setNewUserForm({...newUserForm, name: e.target.value})} /></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Email</label><input type="email" required className="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newUserForm.email} onChange={(e)=>setNewUserForm({...newUserForm, email: e.target.value})} /></div>
                  <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Sandi</label><input type="text" required placeholder="Min 6 Karakter" className="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold" value={newUserForm.password} onChange={(e)=>setNewUserForm({...newUserForm, password: e.target.value})} /></div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Peran</label><select className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold cursor-pointer" value={newUserForm.role} onChange={(e)=>setNewUserForm({...newUserForm, role: e.target.value})}><option value="CASHIER">Kasir</option><option value="OWNER">Owner</option></select></div>
                    <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Cabang</label><select required={newUserForm.role !== 'OWNER'} disabled={newUserForm.role === 'OWNER'} className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-[#182030] dark:text-white text-xs font-bold disabled:bg-slate-100 cursor-pointer" value={newUserForm.branch_id} onChange={(e)=>setNewUserForm({...newUserForm, branch_id: e.target.value})}><option value="">- Pilih -</option>{branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}</select></div>
                  </div>
                  <button type="submit" disabled={isLoading} className="w-full mt-3 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md hover:bg-blue-700 transition disabled:opacity-50 cursor-pointer">{isLoading ? 'Menyimpan...' : 'Simpan Karyawan'}</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
